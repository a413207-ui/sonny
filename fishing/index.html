<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>海灣釣魚日記</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a44; font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #3a2a18; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }
  .hud { position: fixed; left: 10px; top: calc(10px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .chip { background: rgba(255,248,230,.92); border: 2px solid #6b4a2a; border-radius: 8px; padding: 3px 9px; font-size: 13px; font-weight: 700; box-shadow: 0 2px 0 #6b4a2a; white-space: nowrap; }
  .chip.row { display: flex; gap: 10px; }
  #mini { position: fixed; right: 10px; top: calc(10px + env(safe-area-inset-top)); width: 128px; height: 96px; border: 3px solid #6b4a2a; border-radius: 10px; background: #26508f; z-index: 5; image-rendering: pixelated; box-shadow: 0 2px 0 #6b4a2a; }
  #miniHint { position: fixed; right: 12px; top: calc(112px + env(safe-area-inset-top)); font-size: 11px; color: #fff; text-shadow: 0 1px 2px #000; z-index: 5; }
  #toggles { position: fixed; right: 10px; top: calc(128px + env(safe-area-inset-top)); z-index: 5; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  #toggles .chip { font-size: 12px; padding: 3px 8px; cursor: pointer; }
  #joy { position: fixed; left: calc(18px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 120px; height: 120px; border-radius: 50%; background: rgba(255,248,230,.25); border: 3px solid rgba(255,248,230,.6); z-index: 6; }
  #knob { position: absolute; left: 35px; top: 35px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,248,230,.9); border: 3px solid #6b4a2a; }
  .btn { position: fixed; z-index: 6; border: 3px solid #6b4a2a; border-radius: 50%; background: #ffd56a; color: #4a2e12; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #6b4a2a; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.1; padding: 4px; cursor: pointer; }
  .btn:active, .btn.down { transform: translateY(3px); box-shadow: 0 1px 0 #6b4a2a; }
  .btn.off { opacity: .35; }
  #btnA { right: calc(20px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); width: 92px; height: 92px; }
  #btnB { right: calc(122px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom)); width: 66px; height: 66px; font-size: 13px; background: #bfe6ff; }
  #toast { position: fixed; left: 50%; top: calc(214px + env(safe-area-inset-top)); transform: translateX(-50%); background: rgba(40,28,14,.85); color: #fff6dd; padding: 6px 14px; border-radius: 16px; font-size: 14px; font-weight: 700; z-index: 7; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 86vw; width: max-content; text-align: center; }
  #toast.show { opacity: 1; }
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20; background: rgba(10,16,30,.55); }
  .overlay.show { display: flex; }
  .card { background: #fff8e6; border: 4px solid #6b4a2a; border-radius: 14px; padding: 14px 16px; width: min(92vw, 380px); max-height: 86vh; overflow: auto; box-shadow: 0 6px 0 #6b4a2a; text-align: center; }
  .card h3 { margin: 10px 0 4px; font-size: 15px; text-align: left; }
  .list { max-height: 52vh; overflow: auto; text-align: left; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px dashed #c8b08a; font-size: 14px; }
  .row button, .tabs button { font-size: 13px; padding: 4px 10px; white-space: nowrap; }
  .row button:disabled { opacity: .4; }
  .row em { font-size: 12px; color: #8a6a4a; white-space: nowrap; }
  .row.unk { opacity: .5; }
  .tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 6px; }
  .tabs button.on { background: #ffb840; }
  .dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 4px; }
  .dex .cell { background: #f3e6c8; border-radius: 6px; padding: 3px; text-align: center; font-size: 11px; cursor: pointer; }
  .dex .cell canvas { width: 64px; height: 32px; margin: 0 auto; }
  .dex .cell.unk span { color: #9a8a7a; }
  .card h2 { margin: 0 0 6px; font-size: 20px; }
  .card .rar { display: inline-block; padding: 1px 10px; border-radius: 10px; color: #fff; font-size: 13px; font-weight: 800; }
  .card canvas { width: 256px; height: 128px; image-rendering: pixelated; display: block; margin: 6px auto; }
  .card .stats { display: flex; justify-content: center; gap: 14px; font-size: 15px; font-weight: 700; margin: 6px 0; }
  .card p { margin: 4px 0 10px; font-size: 14px; color: #6b5034; }
  .card button { border: 3px solid #6b4a2a; border-radius: 10px; background: #ffd56a; font-weight: 800; font-size: 16px; padding: 8px 18px; box-shadow: 0 3px 0 #6b4a2a; cursor: pointer; color: #4a2e12; }
  #bigmap .card { width: min(96vw, 560px); }
  #bigCv { width: 100%; aspect-ratio: 480 / 250; image-rendering: pixelated; border: 3px solid #6b4a2a; border-radius: 8px; background: #26508f; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; font-size: 12px; margin: 6px 0 10px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border: 1px solid #0004; vertical-align: -2px; margin-right: 3px; }
  #bars { position: fixed; left: 50%; top: calc(256px + env(safe-area-inset-top)); transform: translateX(-50%); width: min(78vw, 360px); z-index: 7; display: none; }
  #bars.show { display: block; }
  .bar { height: 14px; background: rgba(255,248,230,.85); border: 2px solid #6b4a2a; border-radius: 8px; margin-bottom: 6px; overflow: hidden; position: relative; }
  .bar > div { height: 100%; width: 0; }
  .bar span { position: absolute; left: 6px; top: -2px; font-size: 11px; font-weight: 800; color: #3a2a18; }
  #tension > div { background: linear-gradient(90deg, #6ccf6c, #ffd040 60%, #e8503a); }
  #dist > div { background: #5aa8e8; }
  /* 音效開關、咬鉤閃光、拉竿按鈕跳動、狀態標籤 */
  #flash { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; box-shadow: inset 0 0 0 10px #ffd040, inset 0 0 90px 36px rgba(255,208,64,.6); }
  #flash.on { animation: flash 1s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 15% { opacity: .25; } 30% { opacity: 1; } 45% { opacity: .3; } 60% { opacity: .9; } 100% { opacity: 0; } }
  .btn.alert { animation: pulse .28s ease-in-out infinite alternate; background: #ff7a3a; color: #fff; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.16); } }
  #statusChip { cursor: pointer; }
  /* 成就收集冊與徽章 */
  .book { background: #f6ead0; border: 3px solid #8a6a3a; border-radius: 6px 12px 12px 6px; padding: 10px 10px 12px 22px; position: relative; box-shadow: inset 6px 0 0 #d8c49a; }
  .book::before { content: ''; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 6px; background: repeating-linear-gradient(#8a6a3a 0 6px, transparent 6px 16px); border-radius: 3px; }
  .book .prog { font-size: 13px; font-weight: 800; margin: 0 0 4px; text-align: left; }
  .book .meter { height: 10px; background: #e2d2ae; border: 2px solid #8a6a3a; border-radius: 6px; overflow: hidden; margin-bottom: 4px; }
  .book .meter > div { height: 100%; background: linear-gradient(90deg, #e0902a, #ffd040); }
  .book .tiers { font-size: 12px; color: #6b5034; text-align: left; margin-bottom: 8px; }
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 6px; }
  .bdg { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font-size: 11px; line-height: 1.25; text-align: center; }
  .bdg b { font-size: 11.5px; }
  .medal { --c1: #e8b07a; --c2: #a8683a; --rb: #c84a3a; position: relative; width: 56px; height: 64px; }
  .medal::before, .medal::after { content: ''; position: absolute; top: 0; width: 14px; height: 24px; background: var(--rb); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); }
  .medal::before { left: 12px; transform: rotate(14deg); } .medal::after { right: 12px; transform: rotate(-14deg); filter: brightness(.8); }
  .medal i { position: absolute; left: 4px; top: 12px; width: 48px; height: 48px; border-radius: 50%; z-index: 1; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 24px;
    background: radial-gradient(circle at 35% 30%, #fff8 0 18%, transparent 19%), radial-gradient(circle, var(--c1) 0 58%, var(--c2) 60% 100%); border: 2px solid #5a3a1e; box-shadow: 0 2px 0 #5a3a1e; }
  .medal.bronze { --c1: #e8b07a; --c2: #a8683a; --rb: #c84a3a; }
  .medal.silver { --c1: #f0f2f6; --c2: #a8b0bc; --rb: #3a78c0; }
  .medal.gold { --c1: #ffe680; --c2: #d89a20; --rb: #4a9a5a; }
  .medal.rainbow { --c1: #fff6d0; --c2: #c070e0; --rb: #e0902a; }
  .medal.rainbow i { background: radial-gradient(circle at 35% 30%, #fff9 0 18%, transparent 19%), conic-gradient(#ff8a8a, #ffd040, #80e0a0, #70b8ff, #c070e0, #ff8a8a); }
  .medal.lock { --c1: #d8ccb4; --c2: #b0a28a; --rb: #b0a28a; }
  .medal.lock i { color: #8a7a62; font-size: 22px; font-weight: 900; }
  .bdg.locked { color: #9a8a72; }
  #badgePop { z-index: 30; }
  /* 圖鑑：點魚放大介紹 */
  #fishDetail { z-index: 25; }
  #fishDetail .card { position: relative; padding-top: 10px; }
  .fd-pic { position: relative; margin: 4px auto 2px; width: min(78vw, 300px); aspect-ratio: 2 / 1; border-radius: 12px; border: 3px solid #8a6a3a; background: radial-gradient(circle at 50% 55%, var(--glow, #fff6dc) 0, #f3e6c8 70%); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .fd-pic canvas { width: 92%; height: 92%; image-rendering: pixelated; margin: 0; animation: fdSwim 2.4s ease-in-out infinite; }
  @keyframes fdSwim { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-4px) rotate(1deg); } }
  .fd-pic .no { position: absolute; left: 8px; top: 6px; font-size: 12px; font-weight: 800; color: #8a6a4a; }
  .fd-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 2px solid #8a6a3a; background: #fff8e6; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; padding: 0; box-shadow: none; }
  .fd-grid { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; text-align: left; font-size: 13px; margin: 8px 0 4px; }
  .fd-grid b { color: #6b5034; white-space: nowrap; }
  .fd-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 4px 0; }
  .fd-tags span { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #f3e6c8; border: 1px solid #c8b08a; }
  #badgePop .card { overflow: hidden; }
  #badgePop .medal { width: 112px; height: 128px; margin: 6px auto 4px; animation: medalIn .9s cubic-bezier(.2,1.4,.4,1) both; }
  #badgePop .medal::before, #badgePop .medal::after { width: 28px; height: 48px; } #badgePop .medal::before { left: 24px; } #badgePop .medal::after { right: 24px; }
  #badgePop .medal i { left: 8px; top: 24px; width: 96px; height: 96px; font-size: 48px; border-width: 3px; }
  #badgePop .rays { position: absolute; inset: -40%; background: repeating-conic-gradient(#ffd04033 0 10deg, transparent 10deg 20deg); animation: spin 8s linear infinite; z-index: 0; pointer-events: none; }
  #badgePop .card > *:not(.rays) { position: relative; z-index: 1; }
  @keyframes medalIn { 0% { transform: scale(.1) rotateY(540deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 換裝 */
  .dress { display: flex; gap: 10px; align-items: flex-start; text-align: left; }
  .dress canvas.pv { width: 96px; height: 156px; image-rendering: pixelated; background: radial-gradient(circle at 50% 70%, #fff6dc, #e8d8b4); border: 3px solid #8a6a3a; border-radius: 10px; flex: none; }
  .slots { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .slots button { font-size: 12px; padding: 3px 8px; border: 2px solid #8a6a3a; border-radius: 8px; background: #fff8e6; box-shadow: none; font-weight: 700; }
  .slots button.on { background: #ffb840; }
  .items { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .items button { font-size: 12.5px; padding: 6px 4px; border: 2px solid #c8b08a; border-radius: 8px; background: #fffdf4; box-shadow: none; font-weight: 700; line-height: 1.25; color: #4a2e12; }
  .items button.on { border-color: #e0902a; background: #ffe7b0; }
  .items button small { display: block; font-weight: 600; color: #8a6a4a; font-size: 11px; }
  .items button.lock { opacity: .55; }
  .hint { font-size: 12px; color: #8a6a4a; margin: 6px 0 0; text-align: left; }
  .bagRow { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-bottom: 1px dashed #c8b08a; font-size: 13px; text-align: left; }
  .bagRow canvas { width: 48px; height: 24px; image-rendering: pixelated; flex: none; }
  .bagRow .r { margin-left: auto; text-align: right; white-space: nowrap; font-size: 12px; color: #6b5034; }
  .bagRow.pick { cursor: pointer; } .bagRow.pick:hover, .bagRow.sel { background: #ffe7b0; }
  .meterS { height: 8px; background: #e2d2ae; border-radius: 4px; overflow: hidden; margin-top: 2px; } .meterS > div { height: 100%; background: #7ac04a; }
  .rank { width: 100%; border-collapse: collapse; font-size: 12px; } .rank td, .rank th { padding: 4px 3px; border-bottom: 1px dashed #c8b08a; text-align: left; white-space: nowrap; }
  .rank tr.me { background: #ffe7b0; font-weight: 800; } .rank td.sc { text-align: right; font-weight: 800; }
  /* 頒獎動畫 */
  #cut.overlay.show { display: block; background: #000; z-index: 40; }
  #cut canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #cut .t { position: absolute; left: 0; right: 0; text-align: center; color: #fff6dd; font-weight: 900; text-shadow: 0 2px 0 #3a2a18, 0 0 8px #000; pointer-events: none; transition: opacity .4s; padding: 0 12px; }
  #statusChip.sick { background: #d8f0b0; border-color: #4a7a2a; box-shadow: 0 2px 0 #4a7a2a; color: #2a4a14; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="chip" id="timeChip">🌞 白天</div>
  <div class="chip" id="areaChip">📍 漁港鎮</div>
  <div class="chip row"><span id="coinChip">🪙 0</span><span id="bagChip">🐟 0</span><span id="baitChip">🪱 0</span></div>
  <div class="chip" id="statusChip" hidden></div>
  <div class="chip" id="bagBtn" style="cursor:pointer">🎒 背包</div>
</div>
<canvas id="mini" width="128" height="96"></canvas>
<div id="miniHint">點地圖放大</div>
<div id="toggles">
  <div class="chip" id="vib">📳 震動：開</div>
  <div class="chip" id="snd">🔊 音效：開</div>
  <div class="chip" id="mus">🎵 音樂：開</div>
</div>
<div id="flash"></div>
<div id="joy"><div id="knob"></div></div>
<div class="btn" id="btnB">上船</div>
<div class="btn" id="btnA">拋竿</div>
<div id="toast"></div>
<div id="bars"><div class="bar" id="tension"><div></div><span>張力</span></div><div class="bar" id="dist"><div></div><span>距離</span></div></div>
<div class="overlay" id="catch"><div class="card" id="catchCard"></div></div>
<div class="overlay" id="bigmap"><div class="card">
  <h2>🗺️ 地圖</h2>
  <canvas id="bigCv" width="480" height="250"></canvas>
  <div class="legend">
    <span><i style="background:#3f8fd0"></i>港灣（近岸）</span><span><i style="background:#26508f"></i>深海</span>
    <span><i style="background:#3fc3c0"></i>珊瑚礁</span><span><i style="background:#4aa88a"></i>翠湖</span>
    <span><i style="background:#4fb0b8"></i>溪谷</span><span><i style="background:#4a7aa8"></i>冰川</span><span><i style="background:#4a7a5a"></i>紅樹林</span><span><i style="background:#4a3a56"></i>火山</span><span><i style="background:#ff5040"></i>你</span><span><i style="background:#ffd040"></i>船</span>
  </div>
  <button id="closeMap">關閉</button>
</div></div>
<div class="overlay" id="panel"><div class="card" id="panelCard"></div></div>
<div class="overlay" id="cut"><canvas id="cutCv"></canvas><div class="t" id="cutTitle" style="font-size:18px"></div><div class="t" id="cutName" style="font-size:22px"></div><div class="t" id="cutPlaque" style="font-size:13px"></div><div class="t" id="cutCap" style="font-size:16px"></div></div>
<div class="overlay" id="fishDetail"><div class="card" id="fishDetailCard"></div></div>
<div class="overlay" id="badgePop"><div class="card" id="badgeCard"></div></div>

<script src="data/fish.js"></script>
<script src="art.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// ════════════════ 基本設定 ════════════════
const FISH = window.FISH_DATA || [];
const N = 120, TW = 32, TH = 16, LH = 4;         // 地圖格數、等角格寬高、陸地高度
const OFS = 20;                                  // 地圖從 80 格擴大到 120 格：原本的島整個往中間移 20 格
const OX = N * TW / 2, OY = 24;
const T = { DEEP: 0, SEA: 1, REEF: 2, LAKE: 3, RIVER: 4, SAND: 5, GRASS: 6, STONE: 7, DOCK: 8, SNOW: 9, ROCK: 10, ICE: 11, COLD: 12, MANGROVE: 13, VOLCANO: 14 };
const WATER = new Set([T.DEEP, T.SEA, T.REEF, T.LAKE, T.RIVER, T.COLD, T.MANGROVE, T.VOLCANO]);
const BOATABLE = new Set([T.DEEP, T.SEA, T.REEF, T.COLD, T.MANGROVE, T.VOLCANO]);
const REGION_OF = { [T.SEA]: 'harbor', [T.DEEP]: 'deep', [T.REEF]: 'reef', [T.LAKE]: 'lake', [T.RIVER]: 'river', [T.COLD]: 'cold', [T.MANGROVE]: 'mangrove', [T.VOLCANO]: 'volcano' };
const REGION_NAME = { harbor: '港灣', deep: '深海', reef: '珊瑚礁', lake: '翠湖', river: '溪谷', cold: '冰川海域', mangrove: '紅樹林河口', volcano: '火山海域' };
const RAR = {
  common: { name: '普通', color: '#8a9a7a', w: 60, pow: .55 },
  uncommon: { name: '少見', color: '#4a9a5a', w: 25, pow: .75 },
  rare: { name: '稀有', color: '#3a7ad0', w: 10, pow: 1.0 },
  epic: { name: '史詩', color: '#9a4ad0', w: 4, pow: 1.25 },
  legendary: { name: '傳說', color: '#e0902a', w: 1, pow: 1.55 },
};
const TILE_COLOR = { [T.DEEP]: '#26508f', [T.SEA]: '#3f8fd0', [T.REEF]: '#3fc3c0', [T.LAKE]: '#4aa88a', [T.RIVER]: '#4fb0b8', [T.SAND]: '#e8d49a', [T.GRASS]: '#7cc04f', [T.STONE]: '#cdbda2', [T.DOCK]: '#a8784a', [T.SNOW]: '#eef4fa', [T.ROCK]: '#4a4448', [T.ICE]: '#dff2ff', [T.COLD]: '#4a7aa8', [T.MANGROVE]: '#4a7a5a', [T.VOLCANO]: '#4a3a56' };
const params = new URLSearchParams(location.search);

// 可重現的雜訊
function hash(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const f = v => Math.max(0, Math.min(255, Math.round(v + (k > 0 ? (255 - v) * k : v * k)))); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

// ════════════════ 地圖生成 ════════════════
const tile = new Uint8Array(N * N).fill(T.DEEP);
const block = new Uint8Array(N * N);         // 1＝樹、建築、岩石擋路
const landOf = new Uint8Array(N * N);        // 屬於哪座島（ISLANDS 索引＋1）
const at = (x, y) => (x < 0 || y < 0 || x >= N || y >= N) ? T.DEEP : tile[y * N + x];

// 螢幕方向 → 世界方向（等角）
function screenToWorld(dx, dy) { const wx = dx / TW + dy / TH, wy = dy / TH - dx / TW; const m = Math.hypot(wx, wy) || 1; return { x: wx / m, y: wy / m }; }

// ════════════════ 動作判斷 ════════════════
function waterAhead(ox, oy, fx, fy) {
  const tryDir = (dx, dy) => { for (const r of [2.4, 1.8, 1.3]) { const x = ox + dx * r, y = oy + dy * r; if (WATER.has(at(Math.floor(x), Math.floor(y)))) return { x, y }; } return null; };
  let hit = tryDir(fx, fy); if (hit) return { ...hit, fx, fy };
  for (let a = 0; a < 8; a++) { const dx = Math.cos(a * Math.PI / 4), dy = Math.sin(a * Math.PI / 4); hit = tryDir(dx, dy); if (hit) return { ...hit, fx: dx, fy: dy }; }
  return null;
}
function nearBuilding() { const p = state.player; return BUILDINGS.find(b => Math.hypot(b.door[0] - p.x, b.door[1] - p.y) < 1.3); }
function landingSpot() {
  const b = state.boat;
  for (let r = 1; r <= 1.6; r += .3) for (let a = 0; a < 16; a++) { const x = b.x + Math.cos(a * Math.PI / 8) * r, y = b.y + Math.sin(a * Math.PI / 8) * r; if (walkable(x, y)) return { x: Math.floor(x) + .5, y: Math.floor(y) + .5 }; }
  return null;
}
function contextB() {
  if (fish.state === 'wait' || fish.state === 'cast') return { label: '收竿', fn: () => endFishing('收竿了') };
  if (fish.state) return null;
  if (state.onBoat) { const s = landingSpot(); return s ? { label: '下船', fn: () => { state.onBoat = false; Object.assign(state.player, s); toast('上岸了'); } } : null; }
  const p = state.player;
  if (Math.hypot(state.boat.x - p.x, state.boat.y - p.y) < 1.8) return { label: '上船', fn: () => { state.onBoat = true; toast('⛵ 用搖桿開船，到不同海域釣不同的魚'); } };
  const b = nearBuilding(); if (b) return { label: '進入', fn: () => openBuilding(b) };
  return null;
}
function contextA() {
  if (fish.state === 'wait') return '拉竿';
  if (fish.state === 'bite') return '拉竿！';
  if (fish.state === 'reel') return '收線\n（按住）';

}

// ════════════════ 釣魚 ════════════════
function regionAt(x, y) { return REGION_OF[at(Math.floor(x), Math.floor(y))] || 'harbor'; }
function startCast() {
  const o = state.onBoat ? state.boat : state.player;
  const w = waterAhead(o.x, o.y, state.player.fx, state.player.fy);
  if (!w) return toast('前面沒有水，換個方向試試');
  state.player.fx = w.fx; state.player.fy = w.fy;
  Object.assign(fish, { state: 'cast', t: 0, region: regionAt(w.x, w.y), fx: w.x, fy: w.y, nibbles: [], d: 100, tension: 0, struggle: false, swap: 0 });
  const wait = rand(2.2, 6.5) / (1 + state.rod.luck * .2) * (WEATHER[weather].bite || 1);
  fish.biteAt = .7 + wait;
  for (let k = 0, n = Math.floor(rand(0, 3)); k < n; k++) fish.nibbles.push(rand(1.2, fish.biteAt - .3));
  toast(`🎣 拋竿！（${REGION_NAME[fish.region]}）浮標沉下去再拉竿`);
}
function pickFish(region) {
  let pool = FISH.filter(f => f.regions.includes(region) && f.times.includes(phase) && (!f.weather || f.weather.includes(weather)));
  // 有天氣限定魚可以釣時，35% 機會從牠們裡面挑
  const special = pool.filter(f => f.weather); if (special.length && Math.random() < .35) pool = special;
  const byR = {}; for (const f of pool) (byR[f.rarity] = byR[f.rarity] || []).push(f);
  const rs = Object.keys(byR); let tot = 0; const wts = rs.map(r => { const w = RAR[r].w * (r === 'common' ? 1 : 1 + state.rod.luck * .3); tot += w; return w; });
  let u = Math.random() * tot, r = rs[0]; for (let i = 0; i < rs.length; i++) { u -= wts[i]; if (u <= 0) { r = rs[i]; break; } }
  const list = byR[r]; const def = list[Math.floor(Math.random() * list.length)];
  const k = Math.pow(Math.random(), 2.2);
  const w = def.weightKg[0] + (def.weightKg[1] - def.weightKg[0]) * k;
  const l = clamp(def.lengthCm[0] + (def.lengthCm[1] - def.lengthCm[0]) * Math.cbrt(k) * rand(.94, 1.06), def.lengthCm[0], def.lengthCm[1]);
  return { def, weight: w, length: l, price: Math.round(def.price * (.6 + .8 * k)), k };
}
function hook() {

  fish.state = 'reel'; fish.t = 0; fish.d = 100; fish.tension = 20; fish.swap = rand(.4, 1.2);
  buzz([60, 30, 60]); SFX.hook();
  toast(fish.catch.def.rarity === 'legendary' || fish.catch.def.rarity === 'epic' ? '‼️ 好重！是大傢伙！按住收線，張力太高就放手' : '上鉤了！按住「收線」，張力太高就放手');
}
function fail(msg) { buzz(200); SFX.fail(); fish.state = 'fail'; fish.t = 0; fish.msg = msg; toast(msg, 2200); }
function endFishing(msg) { fish.state = null; holding = false; if (msg) toast(msg); }

function caught() {

function updateFishing(dt) {
  if (!fish.state) return;
  fish.t += dt;
  if (fish.state === 'cast' && fish.t > .7) fish.state = 'wait';
  if (fish.state === 'wait') {
    for (let i = 0; i < fish.nibbles.length; i++) if (fish.t > fish.nibbles[i]) { fish.nibbles.splice(i, 1); fish.nib = .35; buzz(15); SFX.nibble(); }
    if (fish.nib > 0) fish.nib -= dt;
    if (fish.t > fish.biteAt) { fish.state = 'bite'; fish.biteT = 0; buzz([90, 40, 90]); SFX.bite(); flash(); updateHud(); }
  } else if (fish.state === 'bite') {

// ════════════════ 🏆 釣魚協會：每天 20:00 魚的評比大賽 ════════════════
// 一場 10 條魚：玩家交的魚＋電腦補滿。以後多人連線時，真人越多、電腦補得越少（改 npcEntries 的數量就好）。
// 評分：重量 25%＋長度 25%＋稀有度 50%（重量、長度跟同場最重／最長的比，用對數讓大小差距不會太誇張）
const CONTEST_SIZE = 10, CONTEST_PRIZE = [800, 500, 300], CONTEST_JOIN = 50;
const RAR_SCORE = { common: .2, uncommon: .4, rare: .6, epic: .8, legendary: 1 };
const NPC_NAMES = ['阿海伯', '漁村阿嬤', '船長大衛', '港口小強', '夜釣阿吉', '珊瑚姐', '林教授', '釣魚王老陳', '小美', '燈塔守衛', '溪谷阿嘉', '深海老K'];

const dkey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
function contestHM() { const q = params.get('contest'); if (q && /^\d{1,2}:\d{2}$/.test(q)) return q.split(':').map(Number); return [20, 0]; }   // 測試：?contest=19:30
function contestAt(key) { const [y, mo, da] = key.split('-').map(Number), [h, m] = contestHM(); return new Date(y, mo - 1, da, h, m).getTime(); }

const contestDayName = k => k === dkey(new Date()) ? '今天' : '明天';
const hmText = () => { const [h, m] = contestHM(); return `${pad2(h)}:${pad2(m)}`; };
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function npcEntries(key, n) {   // 同一天大家看到的電腦參賽者都一樣

function contestTable(key) {   // 已比完的用存起來的結果；沒參加的場次就算一份純電腦的排名
