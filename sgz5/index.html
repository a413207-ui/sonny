<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="三國鼎立 — 手機也能玩的三國策略遊戲：8 個史實劇本、內政外交計謀、六角格戰場、天下武鬥大會。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="三國鼎立">
<meta name="theme-color" content="#1b2433">
<title>三國鼎立</title>
<style>[hidden]{display:none!important}html,body{margin:0}</style>
</head>
<body>
<style>
/* Layout: full-screen strategy map, lacquer top bar, scroll-sheet panel at bottom. Single deliberate look (old-game lacquer + parchment). */
:root{
  --lacquer:#1b2433; --lacquer-2:#24304a; --gold:#d8b46a; --gold-dim:#8f7a4f;
  --paper:#efe3c6; --ink:#2b2117; --ink-soft:#6b5a45; --sea:#7fa7a8;
  --f-disp:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--lacquer);color:var(--paper);font-family:var(--f-body);overflow:hidden;
  display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(var(--lacquer-2),var(--lacquer));border-bottom:2px solid var(--gold-dim);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:8px;flex:none}
.top{display:flex;align-items:baseline;gap:12px;justify-content:space-between}
h1{margin:0;font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:.12em;color:var(--gold)}
.date{font-family:var(--f-disp);font-size:14px;color:var(--paper);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.legend::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--gold-dim);background:rgba(0,0,0,.25);
  color:var(--paper);font:600 13px var(--f-body);padding:4px 10px 4px 6px;border-radius:3px;cursor:pointer}
.chip i{width:12px;height:12px;display:block;box-shadow:inset 1px 1px 0 rgba(255,255,255,.5),inset -1px -1px 0 rgba(0,0,0,.4)}
.chip b{font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--lacquer);border-color:var(--gold)}
.chip[aria-pressed="true"] b{color:var(--lacquer)}
.chip:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{position:relative;flex:1;min-height:0}
.layout{flex:1;min-height:0;display:flex}
.mapcol{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--lacquer)}
.mapcol .legend{flex:none;padding:6px 8px;padding-left:max(8px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--gold-dim)}
.side{flex:none;width:clamp(184px,34vw,400px);display:flex;flex-direction:column;min-height:0;background:var(--lacquer);border-left:3px double var(--gold-dim);padding-right:env(safe-area-inset-right,0px)}
.sidehead{flex:none;padding:6px 10px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(var(--lacquer-2),var(--lacquer));border-bottom:2px solid var(--gold-dim)}
.datebox{border:1px solid var(--gold-dim);background:rgba(0,0,0,.25);padding:5px 8px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;font-family:var(--f-disp);color:var(--paper);font-size:14px;font-variant-numeric:tabular-nums}
.datebox b{font-size:18px;letter-spacing:.15em;color:var(--gold)}
.status{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--paper)}
.status .army{font:900 15px var(--f-disp);letter-spacing:.1em;border-left:6px solid var(--fc);padding-left:6px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.status .army small{font:400 11px var(--f-body);color:var(--gold-dim);letter-spacing:0}
.cmdicons{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.cmdicons i{width:9px;height:16px;border:1px solid var(--gold-dim);border-radius:2px;background:rgba(0,0,0,.3)}
.cmdicons i.on{background:var(--gold);border-color:var(--gold)}
.cmdicons span{margin-left:4px;color:var(--gold-dim);font-variant-numeric:tabular-nums}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5em,1fr));gap:2px;font:600 14px var(--f-body);font-variant-numeric:tabular-nums}
.money em{font-style:normal;font:900 12px var(--f-disp);color:var(--lacquer);background:var(--gold);padding:0 4px;margin-right:6px;border-radius:2px}
.fame{display:flex;gap:10px;color:var(--gold-dim)}
.status .endturn{margin:2px 0 0;width:100%}
.sl{display:flex;gap:4px}.sl button{flex:1;border:1px solid var(--gold-dim);background:none;color:var(--gold);font:900 12px var(--f-disp);padding:4px 0;border-radius:3px;cursor:pointer}
.slots button small{color:var(--ink-soft)}
.slots button:disabled{opacity:.45}
svg#map{width:100%;height:100%;display:block;touch-action:none;background:var(--sea);cursor:grab}
.city{cursor:pointer}
.city text{font-family:var(--f-disp);font-weight:900;font-size:16px;fill:var(--ink);paint-order:stroke;stroke:#f3e8cc;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.dim .city:not(.on){opacity:.28}
.zoom{position:absolute;right:max(12px,calc(env(safe-area-inset-right,0px) + 12px));top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border:1px solid var(--gold-dim);background:rgba(27,36,51,.88);color:var(--gold);
  font:900 18px var(--f-disp);border-radius:3px;cursor:pointer}
.sheet{position:absolute;left:0;right:0;bottom:0;background:rgba(239,227,198,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);color:var(--ink);border-top:3px double var(--gold-dim);
  box-shadow:0 -6px 24px rgba(0,0,0,.35);padding-block:12px 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transform:translateY(105%);transition:transform .22s ease;max-height:62%;overflow-y:auto}
.sheet.open{transform:none}
.side .sheet{position:static;transform:none;transition:none;flex:1;min-height:0;max-height:none;overflow-y:auto;background:var(--paper);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;border-top:0;padding:10px}
.side .sheet .close{display:none}
.side .sheet h2{font-size:20px}
.side .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 8px}
.side .stats dd{font-size:15px}
.side .dev{grid-template-columns:2.6em minmax(0,1fr) auto;font-size:12px;gap:4px 6px}
.side .cmdbar{grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin:2px 0}
.side .cmdbar button{font-size:13px;letter-spacing:0;padding:8px 0;border-color:var(--gold-dim)}
.side .gens .g{grid-template-columns:repeat(6,minmax(0,1fr));gap:0 2px;font-size:12px}
.side .gens .g>:first-child{grid-column:1/5;grid-row:1}
.side .gens .g>:last-child{grid-column:5/7;grid-row:1}
.side .gens .g.h>:first-child,.side .gens .g.h>:last-child{display:none}
.side .items div{grid-template-columns:auto 1fr;gap:0 6px}
.side .items small{grid-column:1/-1}
.side .meta{font-size:12px}
.sheet .row1{display:flex;align-items:center;gap:10px}
.sheet .sw{width:26px;height:26px;flex:none;box-shadow:inset 2px 2px 0 rgba(255,255,255,.55),inset -2px -2px 0 rgba(0,0,0,.35)}
.sheet h2{margin:0;font-family:var(--f-disp);font-weight:900;font-size:24px;letter-spacing:.08em;flex:1}
.sheet .close{border:1px solid var(--ink-soft);background:none;color:var(--ink);width:36px;height:36px;border-radius:3px;font-size:18px;cursor:pointer}
.meta{margin:4px 0 10px;color:var(--ink-soft);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 12px;margin:0}
.stats div{border-bottom:1px solid #d6c7a2;padding-bottom:4px;min-width:0}
.stats dt{font-size:12px;color:var(--ink-soft);letter-spacing:.1em}
.stats dd{margin:0;font:600 17px var(--f-body);font-variant-numeric:tabular-nums}
.adj{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-soft)}
.adj button{border:1px solid #b8a67e;background:#f7eedb;color:var(--ink);font:600 13px var(--f-body);padding:4px 10px;border-radius:3px;cursor:pointer}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(27,36,51,.85);color:var(--paper);
  font-size:13px;padding:6px 12px;border-radius:3px;pointer-events:none;white-space:nowrap}
.sec{margin:12px 0 6px;font:900 13px var(--f-disp);letter-spacing:.2em;color:var(--ink-soft)}
.dev{display:grid;grid-template-columns:3em minmax(0,1fr) 4.5em;gap:6px 10px;align-items:center;font-size:13px}
.dev .bar{height:8px;background:#ddd0b0;box-shadow:inset 1px 1px 0 rgba(0,0,0,.15)}
.dev .bar span{display:block;height:100%;background:#7a5e3a}
.dev .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.dev .v small{color:var(--ink-soft);font-weight:400}
.adj button.atk{border-color:#a3362a;background:#f6dcd3;color:#7d2219}
.adj button.atk::after{content:" 可攻";font-size:11px}
.adj button.own{border-color:#6b7c5a}
.endturn{border:1px solid var(--gold);background:var(--gold);color:var(--lacquer);font:900 13px var(--f-disp);padding:5px 12px;border-radius:3px;cursor:pointer}
.cmdbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.cmdbar button{border:1px solid var(--ink);background:var(--lacquer);color:var(--gold);font:900 15px var(--f-disp);letter-spacing:.1em;padding:10px 0;border-radius:3px;cursor:pointer}
.cmdbar button:disabled{opacity:.35;cursor:default}
.gens{display:flex;flex-direction:column;gap:2px;font-size:13px}
.gens .g{display:grid;grid-template-columns:4.5em repeat(6,minmax(0,1fr)) 3.6em;gap:4px;align-items:center;padding:3px 0;border-bottom:1px solid #e0d2ad;font-variant-numeric:tabular-nums}
.gens .g.h{color:var(--ink-soft);font-size:11px;border:0}
.gens .g b{font-family:var(--f-disp);font-weight:900}
.gens .g .st{font-size:11px;text-align:right;color:var(--ink-soft)}
.gens .g.done{opacity:.45}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,22,.18);display:flex;align-items:flex-end}
.modal.mid{align-items:center;justify-content:center}
.modal.mid .box{width:auto;min-width:260px;max-width:calc(100% - 32px);border:1px solid var(--gold-dim);border-radius:4px}
.modal .box{background:rgba(239,227,198,.6);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);box-shadow:0 -6px 24px rgba(0,0,0,.25);color:var(--ink);width:100%;max-height:88%;overflow-y:auto;border-top:3px double var(--gold-dim);
  padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal h3{margin:0 0 4px;font:900 20px var(--f-disp);letter-spacing:.12em}
.modal .note{margin:0 0 10px;font-size:12px;color:var(--ink-soft);line-height:1.5}
.asg{display:flex;flex-direction:column;gap:10px}
.asg .row{display:flex;flex-direction:column;gap:5px;padding-bottom:8px;border-bottom:1px solid #e0d2ad}
.asg .who{display:flex;justify-content:space-between;font-size:13px}
.asg .who b{font:900 15px var(--f-disp)}
.picks{display:flex;gap:4px;flex-wrap:wrap}
.picks button{flex:1 0 auto;border:1px solid #b8a67e;background:#f7eedb;color:var(--ink);font:600 13px var(--f-body);padding:6px 8px;border-radius:3px;cursor:pointer}
.picks button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.picks button small{font-size:11px;opacity:.75}
.mfoot{display:flex;gap:8px;margin-top:12px;align-items:center}
.mfoot .sum{flex:1;font-size:12px;color:var(--ink-soft)}
.mbtn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:900 15px var(--f-disp);padding:9px 16px;border-radius:3px;cursor:pointer}
.mbtn.ghost{background:none;color:var(--ink)}
.mbtn:disabled{opacity:.4}
.glist{display:flex;flex-direction:column;gap:4px}
.glist button{display:grid;grid-template-columns:1.6em 4.5em repeat(5,minmax(0,1fr));gap:4px;align-items:center;text-align:left;border:1px solid #c9b78c;background:rgba(247,238,219,.4);color:var(--ink);padding:7px 8px;border-radius:3px;cursor:pointer;font:400 13px var(--f-body);font-variant-numeric:tabular-nums}
.glist button b{font:900 15px var(--f-disp)}
.glist button .ck{width:16px;height:16px;border:1.5px solid var(--ink);border-radius:2px;display:block}
.glist button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.glist button[aria-pressed="true"] .ck{background:var(--gold);border-color:var(--gold)}
.glist .hd{font-size:11px;color:var(--ink-soft);display:grid;grid-template-columns:1.6em 4.5em repeat(5,minmax(0,1fr));gap:4px;padding:0 9px}
.prev{display:grid;grid-template-columns:3em 1fr;gap:3px 10px;font-size:13px;margin-top:10px;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:auto auto auto auto auto;gap:6px 8px;align-items:baseline;font-variant-numeric:tabular-nums;font-size:15px;margin:6px 0 12px}
.res .n{font:900 14px var(--f-disp);letter-spacing:.1em}
.res .a{color:var(--ink-soft)} .res .b{font-weight:700} .res .d{color:#3f7a3a;font-size:12px}
.gens .tr{display:inline-block;margin-left:3px;font:900 10px var(--f-disp);color:#fff;background:#a3362a;padding:0 3px;border-radius:2px;vertical-align:2px}
.gens .rk{display:block;font:400 10px var(--f-body);color:var(--ink-soft);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.items{display:flex;flex-direction:column;gap:3px;font-size:13px}
.items div{display:grid;grid-template-columns:5.5em 4em minmax(0,1fr);gap:6px;align-items:baseline}
.items b{font:900 14px var(--f-disp)} .items small{color:var(--ink-soft)}
.sub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.sub button{text-align:left;border:1px solid #b8a67e;background:rgba(247,238,219,.45);color:var(--ink);padding:9px 10px;border-radius:3px;cursor:pointer;font-size:12px;line-height:1.4}
.sub button b{display:block;font:900 16px var(--f-disp);letter-spacing:.1em}
.sub button:disabled{opacity:.4;cursor:default}
.glist button.c7{grid-template-columns:1.6em 4.5em repeat(6,minmax(0,1fr))}
.glist .hd.c7{grid-template-columns:1.6em 4.5em repeat(6,minmax(0,1fr))}
.glist button:disabled{opacity:.4;cursor:default}
.log{display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.5;margin:6px 0 4px}
.log div b{font-family:var(--f-disp);font-weight:900}
.log .ok{color:#2f6b2a} .log .ng{color:var(--ink-soft)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.opts button{border:1px solid #b8a67e;background:rgba(247,238,219,.45);color:var(--ink);font:600 13px var(--f-body);padding:6px 10px;border-radius:3px;cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rels{display:grid;grid-template-columns:4.5em minmax(0,1fr) 2.5em minmax(0,1.6fr);gap:4px 8px;align-items:center;font-size:12px;margin-bottom:10px}
.rels b{font:900 14px var(--f-disp)} .rels .bar{height:6px;background:#ddd0b0} .rels .bar span{display:block;height:100%;background:#7a5e3a}
.rels .tg{color:#2f6b2a;font-weight:700} .rels .hs{color:#a3362a;font-weight:700}
.ending{text-align:center}.ending .et{font:900 34px var(--f-disp);letter-spacing:.4em;color:#8c5a1e;margin:4px 0 8px}
.ending p{font-size:14px;line-height:1.7;margin:4px 0}.ending .items{text-align:left}
.anim{position:fixed;inset:0;z-index:45;background:#1b2433;cursor:pointer}
.anim canvas{width:100%;height:100%;display:block}
.anim::after{content:"";position:absolute;inset:0;background:#1b2433;opacity:var(--fade,0);pointer-events:none}
.bub{position:absolute;transform:translate(-50%,-100%);max-width:min(320px,60vw);background:#f3ead2;color:var(--ink);border:2px solid #5a3a22;border-radius:6px;padding:6px 10px;font-size:14px;line-height:1.5;box-shadow:0 3px 8px rgba(0,0,0,.4);pointer-events:none}
.bub b{display:block;font:900 12px var(--f-disp);color:#7a2a20;letter-spacing:.1em}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;border:7px solid transparent;border-top-color:#5a3a22;border-bottom:0;transform:translateX(-50%)}
.talk2d{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,86vw);background:#f3ead2;color:var(--ink);border:2px solid #5a3a22;border-radius:6px;padding:12px 16px;font-size:16px;line-height:1.6}
.talk2d b{display:block;font:900 14px var(--f-disp);color:#7a2a20}
.anim.loading::before{content:"載入中…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--gold);font:900 18px var(--f-disp);letter-spacing:.2em}
.acap{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);text-align:center;color:var(--paper);font-size:14px;text-shadow:0 1px 3px #000;padding:0 16px}
.acap b{font:900 20px var(--f-disp);color:var(--gold);letter-spacing:.2em;margin-right:6px}
.askip{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);color:var(--gold-dim);font-size:12px}
.title{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,16,10,.55),rgba(10,8,5,.88));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px}
.title .tp{width:min(420px,100%);max-height:100%;overflow:auto;text-align:center;color:#f3e7c9}
.title .logo{font:900 64px/1 var(--f-disp);letter-spacing:.12em;color:#f3e7c9;text-shadow:0 2px 0 #7a2a20,0 0 24px rgba(201,162,39,.35);margin:0}
.title .tsub{font:700 15px var(--f-disp);letter-spacing:.5em;color:#c9a227;margin:10px 0 28px}
.title .tm{display:grid;gap:10px}
.title .tm button{font:900 18px var(--f-disp);letter-spacing:.3em;padding:12px;border:1px solid #c9a227;background:rgba(122,42,32,.55);color:#f3e7c9;border-radius:3px;cursor:pointer}
.title .tm button:disabled{opacity:.4;cursor:default}
.title .tm button:not(:disabled):hover{background:rgba(140,31,26,.85)}
.title h3{font:900 22px var(--f-disp);letter-spacing:.2em;margin:0 0 6px;color:#f3e7c9}
.title .note{color:#d8ccb0}
.title .scn{display:block;width:100%;box-sizing:border-box;text-align:left;padding:12px 14px;border:1px solid #c9a227;background:rgba(247,238,219,.95);color:var(--ink);border-radius:3px;cursor:pointer}
.title .scn b{font:900 18px var(--f-disp);display:block}.title .scn small{display:block;margin-top:4px;line-height:1.5}
.title .orow{display:grid;grid-template-columns:5.5em 1fr;gap:8px;align-items:center;text-align:left;margin:12px 0}
.title .orow>span{font-weight:700;color:#c9a227}
.title .opts button{background:rgba(247,238,219,.9)}
.title .opts button[aria-pressed="true"]{background:#8c1f1a;color:#f3e7c9;border-color:#c9a227}
.title .back{margin-top:18px;background:none;border:1px solid #8a7a5a;color:#d8ccb0;padding:8px 18px;border-radius:3px;cursor:pointer}
.title .ver{margin-top:22px;font-size:11px;color:#8a7a5a}
.title input.cin,.title select.cin{font:600 15px var(--f-body);padding:6px 8px;border:1px solid #b8a67e;border-radius:3px;background:#f7eedb;color:var(--ink);max-width:100%}
.title .tp{text-align:center}.title .orow .opts{justify-content:flex-start}
.cstats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cstats>div{background:rgba(247,238,219,.1);border:1px solid #6a5a3a;border-radius:3px;padding:4px;position:relative;text-align:center}
.cstats small{display:block;font-size:11px;color:#c9a227}.cstats small.cap{color:#8a7a5a;font-size:10px}
.cstats b{display:block;font:900 22px var(--f-disp);color:#f3e7c9}

  const mx=vb.x+(sx-r.left)*k,my=vb.y+(sy-r.top)*k;vb.w*=f;apply();const k2=vb.w/r.width;
  vb.x=mx-(sx-r.left)*k2;vb.y=my-(sy-r.top)*k2;apply()}

    zoomAt(target/vb.w,(a.x+b.x)/2,(a.y+b.y)/2);moved=99;return}

/* ================= 音樂與音效（Web Audio 即時合成，不用下載音檔） ================= */
const SND=(()=>{let ac=null,master=null,musicG=null,sfxG=null,mode=null,timer=null,nextT=0,step=0,started=false;

  /* 撥弦（古箏風）：三角波＋快速衰減＋低通 */
  function pluck(t,n,dur=1.2,vol=.22,dest=musicG){const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
    o.type="triangle";o2.type="sine";o.frequency.value=NOTE(n);o2.frequency.value=NOTE(n+12);f.type="lowpass";f.frequency.setValueAtTime(3200,t);f.frequency.exponentialRampToValueAtTime(700,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+dur);

  let noiseBuf=null;const noise=()=>{if(noiseBuf)return noiseBuf;noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return noiseBuf};
  /* 太鼓：低頻正弦掉音＋一點雜音 */
  function drum(t,vol=.5,pitch=90,dest=musicG){const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(pitch*1.8,t);o.frequency.exponentialRampToValueAtTime(pitch*.6,t+.25);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.5);
    const s=ac.createBufferSource(),gn=ac.createGain(),f=ac.createBiquadFilter();s.buffer=noise();f.type="lowpass";f.frequency.value=900;gn.gain.setValueAtTime(vol*.35,t);gn.gain.exponentialRampToValueAtTime(.001,t+.12);
    s.connect(f);f.connect(gn);gn.connect(dest);s.start(t);s.stop(t+.15)}
  function hat(t,vol=.06){const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();s.buffer=noise();f.type="highpass";f.frequency.value=6000;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f);f.connect(g);g.connect(musicG);s.start(t);s.stop(t+.06)}
  function brass(t,n,dur=.3,vol=.09){const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type="sawtooth";o.frequency.value=NOTE(n);f.type="lowpass";f.frequency.value=1400;

  /* ---- 平時：D 宮調五聲音階，慢板古箏 ---- */
  const CALM=[62,64,66,69,71,74,76,78,81];let mel=4;
  function calmStep(t){const beat=60/80/2;   // 八分音符
    const bar=step%16;
    if(bar===0){pad(t,38,beat*16,.05);pad(t,45,beat*16,.035);}
    if(bar===8&&Math.random()<.5)pad(t,43,beat*8,.03);

    if(play){mel=Math.max(0,Math.min(CALM.length-1,mel+[-2,-1,-1,1,1,2,0][Math.floor(Math.random()*7)]));pluck(t,CALM[mel],bar%8===0?2:1.3,bar%4===0?.2:.13);
      if(bar%8===0&&Math.random()<.6)pluck(t,CALM[Math.max(0,mel-3)]-12,2.2,.12)}
    if(bar===14&&Math.random()<.5)pluck(t+beat*.5,CALM[mel]+(Math.random()<.5?2:-3),.8,.08);
    step++;return beat}
  /* ---- 戰場：E 小調，快板，太鼓＋低音頑固音型＋銅管 ---- */
  const BAT=[52,55,57,59,62,64,67,69,71];let bm=3;
  function battleStep(t){const beat=60/138/2;const b=step%16;
    if(b%4===0)drum(t,b===0?.6:.42,b===0?70:85);if(b===6||b===14)drum(t,.3,95);if(b%2===1)hat(t,.04);
    const bass=[40,40,47,40,43,40,47,45][Math.floor(b/2)];if(b%2===0)pluck(t,bass,.35,.16);
    if(step%32<16){if(b%4===2||(b%4===3&&Math.random()<.4)){bm=Math.max(0,Math.min(BAT.length-1,bm+[-1,1,1,-2,2][Math.floor(Math.random()*5)]));brass(t,BAT[bm],.25,.07)}}
    else if(b%8===0)brass(t,BAT[[3,5,4,2][Math.floor(step/8)%4]],beat*6,.08);
    step++;return beat}
  function tick(){if(!ac||!mode)return;while(nextT<ac.currentTime+.25){nextT+=(mode==="battle"?battleStep:calmStep)(nextT)}}
  function play(m){if(mode===m)return;mode=m;if(!ac)return;step=0;nextT=ac.currentTime+.1;if(!timer)timer=setInterval(tick,80)}
  /* ---- 音效 ---- */
  const fx={
    click(){const t=ac.currentTime;const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(500,t+.05);
      g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+.08)},
    hit(){const t=ac.currentTime;drum(t,.5,60,sfxG);const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();s.buffer=noise();f.type="bandpass";f.frequency.value=1800;
      g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);s.connect(f);f.connect(g);g.connect(sfxG);s.start(t);s.stop(t+.22)},
    arrow(){const t=ac.currentTime;const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();s.buffer=noise();f.type="bandpass";f.frequency.setValueAtTime(3000,t);f.frequency.exponentialRampToValueAtTime(800,t+.35);
      g.gain.setValueAtTime(.0,t);g.gain.linearRampToValueAtTime(.25,t+.08);g.gain.exponentialRampToValueAtTime(.001,t+.38);s.connect(f);f.connect(g);g.connect(sfxG);s.start(t);s.stop(t+.4)},
    clang(){const t=ac.currentTime;[1,2.76,5.4].forEach((m,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=620*m;g.gain.setValueAtTime(.18/(i+1),t);g.gain.exponentialRampToValueAtTime(.001,t+.6-i*.12);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+.6)})},
    gong(){const t=ac.currentTime;[1,1.48,2.1,2.9].forEach((m,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=110*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16/(i+1),t+.02);g.gain.exponentialRampToValueAtTime(.001,t+2.2-i*.3);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+2.3)})},
    win(){const t=ac.currentTime;[64,67,71,76].forEach((n,i)=>pluck(t+i*.12,n,1.2,.2,sfxG));drum(t,.4,80,sfxG)},
    lose(){const t=ac.currentTime;[64,62,59,55].forEach((n,i)=>pluck(t+i*.22,n,1.4,.18,sfxG))},
    drumroll(){const t=ac.currentTime;for(let i=0;i<8;i++)drum(t+i*.09,.18+i*.04,90,sfxG);drum(t+.8,.6,60,sfxG)},
  };
  function sfx(name){if(!ac||!OPT.sfx||!fx[name])return;try{fx[name]()}catch(e){}}
  /* 瀏覽器規定要使用者點過畫面才能出聲 */

/* 授予：君主親手把寶物交給跪著的武將；寶馬由侍從牽進來 */
function playGrantAnim(g,item){const lord=G.me;const horse=item.t==="寶馬";
  return anim3D({cap:`<b>授予</b>　${g.n} 獲賜 ${item.n}`,dur:8.6,lines:[[lord,`此乃${item.n}，就賜給你了。`],[g.n,"末將定不負主公所託！"]],
    build(C){const{K,T3}=C,{mesh,box3}=K;C.light(.55,.5);C.h=hall3D(C,lord);
      C.p=K.person({robe:0x3e5a8a});C.p.g.position.set(0,0,7);C.p.g.rotation.y=Math.PI;
      if(horse){C.hs=horse3D(C,item.n==="赤兔馬"?0x9a2a1a:item.n==="的盧"?0xe8e0d0:0x3a2a1a);C.hs.g.position.set(-8,0,1.5);C.hs.g.rotation.y=Math.PI/2;
        C.groom=K.person({robe:0x6a6a5a,hat:"band"});C.groom.g.position.set(-7,0,2.2);C.groom.g.rotation.y=Math.PI/2}
      else{C.it=item.t==="武器"?mesh(box3(.08,1.4,.12),0xd8dde0,0,0,0):mesh(box3(.5,.12,.35),0xd8c49a,0,0,0);C.h.lord.armR.add(C.it);C.it.position.set(0,-.75,.25)}},
    tick(C,t){const w=C.ease(C.seg(t,.3,2.2));C.p.g.position.z=7-5.5*w;if(w>0&&w<1)C.p.walk(t*7);else C.p.walk(0,0);kneel(C.p,C.ease(C.seg(t,2.2,2.7)));
      if(t>2.8)C.once("a",()=>C.say(C.h.lord,lord,`此乃${item.n}，就賜給你了。`));
      if(horse){const h=C.ease(C.seg(t,3,5.4));C.hs.g.position.x=-8+7*h;C.groom.g.position.x=-7+7*h;if(h>0&&h<1){C.hs.trot(t*8);C.groom.walk(t*8)}else{C.hs.trot(0,0);C.groom.walk(0,0)}
        C.groom.armR.rotation.x=-1;if(t>5.6){C.p.armR.rotation.x=-1.4}}
      else{const s=C.ease(C.seg(t,3.4,4.2));C.h.lord.sit(.85*(1-s));const m=C.ease(C.seg(t,4.2,5.6));C.h.lord.g.position.set(0,1.5*(1-m),-4.4+3.2*m);if(m>0&&m<1)C.h.lord.walk(t*7);else C.h.lord.walk(0,0);
        C.h.lord.armR.rotation.x=-1.1;if(t>5.8&&C.it.parent!==C.p.armR){C.p.armR.add(C.it);C.p.armL.rotation.x=-1.2}C.p.armR.rotation.x=t>5.8?-1.3:0}
      if(t>6.1)C.once("b",()=>C.say(C.p,g.n,"末將定不負主公所託！"));if(t>7.2)C.p.body.rotation.x=.35+Math.abs(Math.sin(t*3))*.3},
    camAt:hallCam})}

/* 沒收：侍從上前收走寶物，武將低頭不語 */
function playConfiscateAnim(g,items){const lord=G.me;
  return anim3D({cap:`<b>沒收</b>　收回 ${g.n} 的 ${items.map(i=>i.n).join("、")}`,dur:7.6,lines:[[lord,`${g.n}，${items[0].n}暫且收回。`],[g.n,"……是。"]],
    build(C){const{K}=C,{mesh,box3}=K;C.light(.45,.45);C.h=hall3D(C,lord);
      C.p=K.person({robe:0x3e5a8a});C.p.g.position.set(0,0,1.5);C.p.g.rotation.y=Math.PI;kneel(C.p,1);
      C.it=mesh(box3(.08,1.2,.12),0xd8dde0,0,0,0);C.p.armR.add(C.it);C.it.position.set(0,-.7,.2);C.p.armR.rotation.x=-.9;
      C.att=K.person({robe:0x6a6a5a,hat:"band"});C.att.g.position.set(5,0,1)},
    tick(C,t){if(t>.6)C.once("a",()=>C.say(C.h.lord,lord,`${g.n}，${items[0].n}暫且收回。`));
      const a=C.ease(C.seg(t,1.8,3.4));C.att.g.position.set(5-4.1*a,0,1+.5*a);C.att.g.rotation.y=-Math.PI/2;if(a>0&&a<1)C.att.walk(t*7);else C.att.walk(0,0);
      if(t>3.6&&C.it.parent!==C.att.armR){C.att.armR.add(C.it);C.att.armR.rotation.x=-1}
      const b=C.ease(C.seg(t,4.4,6));if(t>4.4){C.att.g.rotation.y=Math.PI/2;C.att.g.position.x=.9+4.5*b;if(b<1)C.att.walk(t*7)}
      C.p.armR.rotation.x=t>3.6?0:-.9;C.p.body.rotation.x=.35+.25*C.ease(C.seg(t,3.8,4.6));
      if(t>4.8)C.once("b",()=>C.say(C.p,g.n,"……是。"))},
    camAt:hallCam})}

/* 修行：背著行囊走出城門，踏上山路 */
function playTrainAnim(names){
  return anim3D({cap:`<b>修行</b>　${names.join("、")} 出外修行一年`,dur:8,bg:0xbfd0d4,fog:[0xcfd6cc,30,110],lines:[[names[0],"此去一年，必有所成！"]],
    build(C){const{K,T3}=C,{mesh,box3,cone,cyl}=K;C.light(.7,.85,[12,26,10]);
      mesh(box3(300,.1,300),0xb9a77e,0,-.05,0);
      // 城門在身後
      mesh(box3(26,5,2),0x9c8a6c,0,2.5,8);for(const x of[-2.4,2.4])mesh(box3(2,6,2.6),0x8a6a4a,x,3,8);mesh(box3(3,3.4,2.2),0x2b2117,0,1.7,8);
      const r=mesh(cone(4.6,2.2,4),0x3a2c1e,0,7.1,8);r.rotation.y=Math.PI/4;r.scale.set(1,1,.6);mesh(box3(6.4,1.6,2.8),0x7a2a20,0,6.2,8);
      // 山路蜿蜒往遠處
      C.path=[];for(let i=0;i<=40;i++){const z=6-i*1.6;const x=Math.sin(i*.25)*4*(i/40);C.path.push(new T3.Vector3(x,0,z));const s=mesh(box3(2.2,.05,1.8),0xa9875a,x,.02,z)}
      for(let i=0;i<16;i++){const a=i/16*Math.PI*1.2+Math.PI*.9;const rr=55+(i%3)*8;const h=18+(i*7)%12;mesh(cone(12,h,6),[0x7f9a7a,0x8a9c8e,0x6f8a6c][i%3],Math.cos(a)*rr*.6,h/2-1,-40+Math.sin(a)*20)}
      for(let i=0;i<24;i++){const p=C.path[Math.min(40,4+i)];const sd=i%2?1:-1;mesh(cyl(.15,.2,1.2),0x5d4528,p.x+sd*(3+(i%3)),.6,p.z);mesh(cone(1,2.4,7),0x3f5f2f,p.x+sd*(3+(i%3)),2.2,p.z)}
      C.ps=names.slice(0,3).map((n,i)=>{const p=K.person({robe:[0x5a6a4a,0x3e5a8a,0x6b4a2a][i],hat:"topknot"});const bag=mesh(box3(.5,.6,.3),0x8a6a3f,0,0,0);p.body.add(bag);bag.position.set(0,.8,-.32);
        const st=mesh(cyl(.035,.035,1.8,5),0x5d4528,0,0,0);p.armR.add(st);st.position.set(0,-.4,.1);return p})},
    tick(C,t){C.ps.forEach((p,i)=>{const u=Math.max(0,Math.min(1,(t-.4-i*.5)/6.6))*36;const k=Math.floor(u),f=u-k;const a=C.path[k],b=C.path[Math.min(40,k+1)];
        p.g.position.copy(a).lerp(b,f);p.g.position.x+=(i-1)*.6;p.g.rotation.y=Math.atan2(b.x-a.x,b.z-a.z);if(u>0&&u<36)p.walk(t*7);else p.walk(0,0)});
      if(t>1.4)C.once("a",()=>C.say(C.ps[0],names[0],"此去一年，必有所成！"));if(t>3.6)C.once("b",()=>C.hush())},
    camAt(C,t){const zk=C.zk();const k=C.ease(C.seg(t,0,8));const p=C.ps[0].g.position;
      return[new C.T3.Vector3(p.x+3*zk,(4+10*k)*zk,p.z+(9+14*k)*zk),new C.T3.Vector3(p.x,1.2,p.z-4-8*k)]}})}

/* 移動：騎馬沿路前往另一座城 */
function playMoveAnim(names,from,to){
  return anim3D({cap:`<b>移動</b>　${names.slice(0,4).join("、")}${names.length>4?" 等":""} 從 ${from} 前往 ${to}`,dur:7,bg:0xbfd0d4,fog:[0xcfd6cc,30,110],
    build(C){const{K,T3}=C,{mesh,box3,cone,cyl}=K;C.light(.7,.85,[10,26,12]);
      mesh(box3(300,.1,300),0xb9a77e,0,-.05,0);mesh(box3(80,.04,3.2),0xa9875a,0,.02,0);
      for(let i=0;i<20;i++){const x=-38+i*4;for(const sd of[-1,1]){if((i+(sd>0?1:0))%2)continue;mesh(cyl(.15,.2,1.2),0x5d4528,x,.6,sd*(4+(i%3)));mesh(cone(1.1,2.6,7),0x3f5f2f,x,2.3,sd*(4+(i%3)))}}
      for(let i=0;i<10;i++){const h=14+(i*5)%9;mesh(cone(10,h,6),0x8a9c8e,-40+i*9,h/2-1,-45)}
      // 目的地城門
      mesh(box3(2,5,16),0x9c8a6c,26,2.5,0);mesh(box3(2.6,3.4,3),0x2b2117,26,1.7,0);const r=mesh(cone(4,2,4),0x3a2c1e,26,6.3,0);r.rotation.y=Math.PI/4;r.scale.set(.6,1,1);mesh(box3(2.8,1.4,6),0x7a2a20,26,5.4,0);
      C.riders=names.slice(0,4).map((n,i)=>{const hs=horse3D(C,[0x6b4a2a,0x3a2a1a,0x9a6a3a,0x5a4a3a][i]);hs.g.rotation.y=Math.PI/2;
        const p=K.person({robe:[0x3e5a8a,0x5a6a4a,0x7a2a20,0x6b4a2a][i],hat:"topknot"});p.g.rotation.y=Math.PI/2;p.sit(.6);p.legL.rotation.z=-.5;p.legR.rotation.z=.5;
        return{hs,p,off:i*2.6}});
      C.dust=[];for(let i=0;i<14;i++){const m=new C.T3.Mesh(C.K.ball(.3),new C.T3.MeshBasicMaterial({color:0xb79a6a,transparent:true,opacity:0}));C.scene.add(m);C.dust.push(m)}},
    tick(C,t){const x0=-22+40*C.ease(C.seg(t,.2,6.4));
      C.riders.forEach((r,i)=>{const x=x0-r.off;r.hs.g.position.set(x,0,(i%2?.6:-.6));r.p.g.position.set(x,1.05+Math.abs(Math.sin(t*9+i))*.08,(i%2?.6:-.6));r.hs.trot(t*10+i,.7)});
      C.dust.forEach((d,i)=>{const k=(t*1.8+i/14)%1;const r=C.riders[i%C.riders.length];d.position.set(x0-r.off-1.2-k*2.5,.2+k*.5,(i%2?.6:-.6)+(k-.5));d.material.opacity=(1-k)*.35;d.scale.setScalar(.5+k*1.6)})},
    camAt(C,t){const zk=C.zk();const x=-22+40*C.ease(C.seg(t,.2,6.4))-2;return[new C.T3.Vector3(x-4*zk,4.5*zk,12*zk),new C.T3.Vector3(x+2,1,0)]}})}

/* 說服俘虜：牢房，隔著木柵勸降；成功開門一起走出，失敗撇頭不理 */
function playPrisonAnim(envoy,g,ok){const lord=G.me;
  const lines=ok?[[envoy,`${g.n}，${g.from||"舊主"}已不足恃，何不歸順我主${lord}？`],[g.n,"……也罷。承蒙不殺之恩，願效犬馬之勞。"]]
    :[[envoy,`${g.n}，${g.from||"舊主"}已不足恃，何不歸順我主${lord}？`],[g.n,"呸！要殺便殺，休想我投降！"]];
  return anim3D({cap:`<b>說服</b>　${envoy} 前往大牢勸降 ${g.n}`,dur:ok?9:8,bg:0x14100c,lines,
    build(C){const{K,T3}=C,{mesh,box3,cyl}=K;C.scene.add(new T3.HemisphereLight(0x9aa0b0,0x2a2018,.35));
      const torch=new T3.PointLight(0xffa050,1.3,16);torch.position.set(-3.5,3,1.5);torch.castShadow=true;C.scene.add(torch);C.torch=torch;
      mesh(box3(24,.1,30),0x4a443c,0,-.05,8);mesh(box3(24,10,.4),0x5a544a,0,5,-3);mesh(box3(.4,10,10),0x5a544a,3.2,5,2);
      for(let x=-11;x<12;x+=1.2)for(let y=.6;y<10;y+=1.1)mesh(box3(1.1,.04,.05),0x3a362f,x+(Math.floor(y)%2)*.6,y,-2.78);
      mesh(box3(.15,.15,.6),0x3a2c1e,-3.6,2.6,-2.6);const fl=mesh(K.cone(.18,.45,6),0xffb347,-3.6,2.95,-2.5);fl.material=new T3.MeshBasicMaterial({color:0xffb347});C.fl=fl;
      // 柵欄（中間一扇門）
      C.door=new T3.Group();C.scene.add(C.door);
      for(let x=-5;x<=3;x+=.45){const b=mesh(cyl(.07,.07,4,6),0x4a2e1a,x,2,.6);if(x>-1.2&&x<.6)C.door.add(b)}
      for(const y of[.4,3.8])mesh(box3(8.4,.15,.15),0x4a2e1a,-1,y,.6);
      C.pr=K.person({robe:0x6a6a5a,hat:"topknot",beard:true});C.pr.g.position.set(0,0,-1.2);C.pr.sit(1);
      for(const s of[-1,1]){const ch=mesh(box3(.04,.04,1.6),0x6a6a6a,s*.4,.5,-1.9);ch.rotation.x=.4}
      C.en=K.person({robe:0x7a2a20,hat:"official"});C.en.g.position.set(-7,0,2.4);C.en.g.rotation.y=Math.PI/2},
    tick(C,t){C.fl.scale.y=1+Math.sin(t*14)*.2;C.torch.intensity=1.25+Math.sin(t*11)*.1;
      const w=C.ease(C.seg(t,.3,2.2));C.en.g.position.x=-7+6.6*w;if(w>0&&w<1)C.en.walk(t*7);else C.en.walk(0,0);if(t>2.2)C.en.g.rotation.y=Math.PI;
      if(t>2.6)C.once("a",()=>C.say(C.en,envoy,lines[0][1]));if(t>2.6&&t<4.4)C.en.armR.rotation.x=-.7-Math.sin(t*6)*.15;else C.en.armR.rotation.x=0;
      if(ok){if(t>4.6)C.once("b",()=>C.say(C.pr,g.n,lines[1][1]));C.pr.body.rotation.x=t>4.6?.3:0;
        const o=C.ease(C.seg(t,6,6.8));C.door.position.x=1.6*o;
        const st=C.ease(C.seg(t,6.4,6.9));C.pr.sit(1-st);const m=C.ease(C.seg(t,6.9,8.6));C.pr.g.position.set(0-6*m,0,-1.2+3.2*m);
        if(t>6.9){C.pr.g.rotation.y=-Math.PI/2;C.en.g.rotation.y=-Math.PI/2;C.en.g.position.x=-.4-6*m;if(m<1){C.pr.walk(t*7);C.en.walk(t*7)}}}
      else{if(t>4.6)C.once("b",()=>C.say(C.pr,g.n,lines[1][1]));
        C.pr.body.rotation.y=t>4.4?-1.2*C.ease(C.seg(t,4.4,5)):0;C.pr.body.rotation.x=t>4.6&&t<5.2?-.2:0;
        if(t>6.2){C.en.g.rotation.y=-Math.PI/2;const m=C.seg(t,6.4,7.8);C.en.g.position.x=-.4-6.6*m;if(m<1)C.en.walk(t*8)}}},
    camAt(C,t){const zk=C.zk();return[new C.T3.Vector3(-1.2,3.2*zk,8.5*zk),new C.T3.Vector3(-1,1.4,0)]}})}

/* ================= 軍事動畫（3D）：出征、徵兵、募兵、訓練、運輸、研發 ================= */
function soldier3D(C,{robe=0x7a2a20,spear=true,helmet=0x5a5a5a}={}){const{K}=C,{mesh,box3,cyl,cone}=K;const p=K.person({robe});
  const hm=mesh(cone(.3,.35,8),helmet,0,1.62,0);p.body.add(hm);
  if(spear){const sp=new C.T3.Group();p.armR.add(sp);sp.position.set(0,-.62,0);sp.add(mesh(cyl(.03,.03,2.6,5),0x5d4528,0,.6,0));sp.add(mesh(cone(.07,.3,5),0xc8ccd0,0,2.05,0));p.spear=sp}
  return p}
function ground3D(C,col=0xb9a77e){const{K}=C;K.mesh(K.box3(300,.1,300),col,0,-.05,0)}
function gate3D(C,x,z,rotY=0){const{K,T3}=C,{mesh,box3,cone}=K;const g=new T3.Group();g.position.set(x,0,z);g.rotation.y=rotY;C.scene.add(g);
  const add=m=>{g.add(m);return m};add(mesh(box3(26,5,2),0x9c8a6c,0,2.5,0));for(const sx of[-2.4,2.4])add(mesh(box3(2,6,2.6),0x8a6a4a,sx,3,0));
  add(mesh(box3(3,3.4,2.2),0x2b2117,0,1.7,0));add(mesh(box3(6.4,1.6,2.8),0x7a2a20,0,6.2,0));const r=add(mesh(cone(4.6,2.2,4),0x3a2c1e,0,7.1,0));r.rotation.y=Math.PI/4;r.scale.set(1,1,.6);return g}
function flag3D(C,parent,col=0xc0392b,h=3){const{K}=C,{mesh,box3,cyl}=K;const pole=mesh(cyl(.04,.04,h,5),0x5d4528,0,h/2,0);parent.add(pole);
  const fl=mesh(box3(.03,.8,1.1),col,0,h-.5,.55);parent.add(fl);return fl}
const outdoorCam=(C,from,to)=>{const zk=C.zk();return[new C.T3.Vector3(from[0]*zk,from[1]*zk,from[2]*zk),new C.T3.Vector3(...to)]};

/* 出征：城門大開，將軍騎馬領軍，旗幟飄揚，戰鼓聲中出城 */
function playMarchAnim(src,dst,names){const lead=names[0];
  return anim3D({cap:`<b>出征</b>　${names.slice(0,3).join("、")}${names.length>3?` 等 ${names.length} 將`:""} 從 ${src} 出兵 ${dst}`,dur:7.5,bg:0xbfc8c4,fog:[0xcfd0c4,35,110],
    lines:[[lead,`目標 ${dst}，全軍出擊！`]],
    build(C){const{K}=C;C.light(.65,.85,[14,26,12]);ground3D(C);gate3D(C,0,-10);K.mesh(K.box3(5,.04,60),0xa9875a,0,.02,10);
      C.hs=horse3D(C,0x3a2a1a);C.gen=K.person({robe:0x7a2a20,hat:"official"});C.gen.sit(.6);C.gen.legL.rotation.z=-.5;C.gen.legR.rotation.z=.5;
      C.troops=[];for(let r=0;r<6;r++)for(let c=0;c<4;c++){const s=soldier3D(C,{});s.r=r;s.c=c;C.troops.push(s)}
      C.flags=[];for(let i=0;i<4;i++){const g=new C.T3.Group();C.scene.add(g);g.userData.i=i;C.flags.push({g,fl:flag3D(C,g,[0xc0392b,0x2f5fa8][i%2],3.6)})}
      C.drum=[-4.5,4.5].map(x=>{const d=K.mesh(K.cyl(.6,.6,.7,14),0x8c2a20,x,1,-6.5);d.rotation.z=Math.PI/2;const p=K.person({robe:0x5a4a3a,hat:"band"});p.g.position.set(x+(x<0?-.9:.9),0,-6.5);p.g.rotation.y=x<0?Math.PI/2:-Math.PI/2;return p})},
    tick(C,t){const z0=-10+16*C.ease(C.seg(t,.3,7));C.hs.g.position.set(0,0,z0+3);C.hs.trot(t*8,.5);C.gen.g.position.set(0,1.05+Math.abs(Math.sin(t*8))*.06,z0+3);
      C.gen.armR.rotation.x=t>1&&t<3?-2.6:0;
      C.troops.forEach(s=>{const z=z0-1.4-s.r*1.4;s.g.position.set((s.c-1.5)*1.1,0,z);s.g.visible=z>-10.5;s.walk(t*8+s.r,.45);s.armR.rotation.x=-.3});
      C.flags.forEach(f=>{const i=f.g.userData.i;f.g.position.set(i%2?2.6:-2.6,0,z0-1.4-(i<2?1:4)*1.4);f.g.visible=f.g.position.z>-10.5;f.fl.rotation.y=Math.sin(t*5+i)*.4});
      C.drum.forEach((p,i)=>{p.armR.rotation.x=-1.4+Math.abs(Math.sin(t*7+i))*.8;p.armL.rotation.x=-1.4+Math.abs(Math.sin(t*7+i+1.5))*.8});
      if(t>1)C.once("a",()=>C.say(C.gen,lead,`目標 ${dst}，全軍出擊！`));if(t>3.4)C.once("b",()=>C.hush())},
    camAt(C,t){const z=-10+16*C.ease(C.seg(t,.3,7));return outdoorCam(C,[7,4.2,z+11],[0,1.8,z-2])}})}

/* ================= 計謀動畫（3D，多在夜晚） ================= */
function night(C,moon=.35){const{T3}=C;C.scene.add(new T3.HemisphereLight(0x6a7aa0,0x1a140e,moon));
  const m=new T3.DirectionalLight(0x9ab0e0,.35);m.position.set(-10,20,8);m.castShadow=true;m.shadow.mapSize.set(512,512);Object.assign(m.shadow.camera,{left:-25,right:25,top:25,bottom:-25,near:1,far:80});C.scene.add(m)}
function torch3D(C,x,y,z,int=1.2,dist=12){const{T3,K}=C;const l=new T3.PointLight(0xff9a40,int,dist);l.position.set(x,y+.4,z);C.scene.add(l);
  const f=K.mesh(K.cone(.14,.4,6),0xffa040,x,y,z);f.material=new T3.MeshBasicMaterial({color:0xffb050});return{l,f,base:int}}
function flick(tr,t,i=0){tr.f.scale.y=1+Math.sin(t*13+i)*.2;tr.l.intensity=tr.base*(1+Math.sin(t*11+i*2)*.08)}
function houses3D(C,rows=[-1,1],n=4,gap=4.4,off=7){const{K}=C,{mesh,box3,cone}=K;for(const sd of rows)for(let i=0;i<n;i++){const x=sd*off,z=-8+i*gap;
  mesh(box3(3,2.6,3.6),[0xb8a888,0xa89878][i%2],x,1.3,z);const r=mesh(cone(2.8,1.5,4),0x2e2620,x,3.3,z);r.rotation.y=Math.PI/4}}
function room3D(C,wall=0x6a5a48){const{K}=C,{mesh,box3,cyl}=K;mesh(box3(30,.1,30),0x5a3e26,0,-.05,8);mesh(box3(30,10,.3),wall,0,5,-3.2);
  mesh(box3(2.6,.12,1.2),0x5a3a22,0,.62,0);for(const x of[-1.15,1.15])for(const z of[-.45,.45])mesh(box3(.1,.6,.1),0x4a2e1a,x,.3,z);
  mesh(cyl(.06,.08,.18,8),0xe8e0c8,.5,.77,0)}
function fire3D(C,x,z,scale=1){const{T3,K}=C;const g=new T3.Group();g.position.set(x,0,z);C.scene.add(g);const fl=[];
  for(let i=0;i<6;i++){const m=K.mesh(K.cone(.5,1.6,6),[0xff7a1a,0xffb040,0xff5a1a][i%3],Math.cos(i)*.7,.8,Math.sin(i*1.7)*.7);m.material=new T3.MeshBasicMaterial({color:[0xff7a1a,0xffb040,0xff5a1a][i%3],transparent:true,opacity:.9});g.add(m);fl.push(m)}
  const l=new T3.PointLight(0xff7a2a,0,22);l.position.set(x,2.5,z);C.scene.add(l);g.scale.setScalar(.01);
  return{g,fl,l,set(k,t){g.scale.setScalar(Math.max(.01,k*scale));l.intensity=2.2*k;fl.forEach((m,i)=>{m.scale.y=1+Math.sin(t*12+i)*.25})}}}
const sayAt=(C,t,at,key,who,name,txt)=>{if(t>at)C.once(key,()=>C.say(who,name,txt))};

/* 共用場景：host 的大殿 */

      C.env=K.person({robe:0x3e5a8a,hat:"official"});C.env.g.position.set(0,0,7);C.env.g.rotation.y=Math.PI;
      C.bear=gift?[-1.2,1.2].map(x=>{const p=K.person({robe:0x6a6a5a,hat:"band"});p.bx=x;p.g.position.set(x,0,8.3);p.g.rotation.y=Math.PI;
        const ch=mesh(box3(.7,.45,.5),0x8c2a20,0,0,0);p.body.add(ch);ch.position.set(0,1.0,.45);p.armL.rotation.x=p.armR.rotation.x=-1.1;return p}):[];
      C.adv=adv?K.person({robe:0x2b3a4a,hat:"scholar",beard:true}):null;if(C.adv){C.adv.g.position.set(-3.4,0,-1.8);C.adv.g.rotation.y=Math.PI/2}
      C.gen=K.person({robe:0x5a4a3a,hat:"topknot"});C.gen.g.position.set(3.4,0,-1.8);C.gen.g.rotation.y=-Math.PI/2;
      if(emperor){C.adv=null;C.gen.g.position.set(3,0,-2.2)}},
    tick(C,t){const{env,bear,adv,h}=C,lord=h.lord;

/* 骰點數：武力、統率、智力、政治、魅力五項一起算總和，總和在「上限−30～上限」之間，每項至少 30、不超過類型上限 */
const SKEYS=["war","lead","int","pol","cha"];
const capOfT=(T,k)=>k==="lead"?T.lead:T.cap[k];
function rollStats(type){const T=CTYPES[type];const keys=SKEYS;const S=rint(T.sum-30,T.sum);
  const v={war:30,lead:30,int:30,pol:30,cha:30};let left=S-150;const w={};keys.forEach(k=>w[k]=.15+Math.random()+((T.bias||{})[k]||0));
  for(let guard=0;left>0&&guard<200;guard++){const open=keys.filter(k=>v[k]<capOfT(T,k));if(!open.length)break;const tw=open.reduce((a,k)=>a+w[k],0);
    let used=0;open.forEach(k=>{if(used>=left)return;const add=Math.min(capOfT(T,k)-v[k],left-used,Math.max(1,Math.floor(left*w[k]/tw)));v[k]+=add;used+=add});left-=used;
    if(used===0)break}
  return v}

function customToGen(c){return{n:c.n,war:c.war,lead:c.lead,int:c.int,pol:c.pol,cha:c.cha,aff:c.aff,birth:c.birth,life:rint(55,80),custom:true,cforms:c.forms.slice(),skills:[c.skill],renown:0}}

function placeCustom(c,s){const base=customToGen(c);

/* ================= 壽命：病倒 → 病逝；君主過世由繼承人接位 ================= */
const lifeOf=g=>(g.life||70)+(OPT.life==="long"?15:0);

  for(const n of Object.keys(GEN)){const g=GEN[n];if(!g.birth||g.dying)continue;const age=G.year-g.birth;if(age<lifeOf(g))continue;
    const mine=g.f===G.me||g.jail===G.me;
    if(!g.sick){if(Math.random()<.35){g.sick=true;if(mine||isLord(g))notes.push(`<span style="color:#e0a060">${g.n}（${age} 歲）病倒了</span>`)}continue}
    if(Math.random()<.25){
      if(isLord(g)){if(g.f===G.me){g.dying=true;queue.unshift({kind:"succ",f:g.f})}else{notes.push(`<span style="color:#e0604f">${g.f} 病逝</span>`);succeed(g.f,pickHeir(g.f),notes)}}
      else{if(mine)notes.push(`<span style="color:#e0604f">${g.n} 病逝，享年 ${age} 歲</span>`);removeGen(g)}}}}
function removeGen(g){if(info[g.city]&&info[g.city].gov===g.n)info[g.city].gov="—";
  if(G.advisor)for(const f in G.advisor)if(G.advisor[f]===g.n)delete G.advisor[f];
  itemsOf(g.n).forEach(i=>{i.owner=null;i.stock=g.f||g.jail||null});delete GEN[g.n]}
const SURN2=["諸葛","司馬","夏侯","公孫","太史","皇甫","鮮于","毌丘"];const surname=n=>SURN2.find(x=>n.startsWith(x))||n[0];
/* 繼承人：同姓（家族）優先，再看魅力與威名 */
const heirsOf=f=>{const sn=surname(f);const sc=g=>(surname(g.n)===sn?1000:0)+eff(g,"cha")+(g.renown||0)/100;return Object.values(GEN).filter(g=>g.f===f&&g.n!==f&&!g.mole).sort((a,b)=>sc(b)-sc(a))};
const pickHeir=f=>heirsOf(f)[0]||null;
/* 繼承：勢力改用新君主的名字，所有記錄一起改 */
function renameFaction(o,n){if(o===n)return;
  const mv=obj=>{if(obj&&o in obj){obj[n]=obj[o];delete obj[o]}};
  [F,CAP,LORD_AFF,BANK,BONUS,TECHS,RESEARCH,G.advisor,JOINT].forEach(mv);
  for(const M of[REL,TREATY,HOSTILE])for(const k of Object.keys(M)){const p=k.split("|");if(p.includes(o)){const nk=p.map(x=>x===o?n:x).sort().join("|");M[nk]=M[k];delete M[k]}}
  for(const k in info){if(info[k].f===o)info[k].f=n;if(info[k].scout&&o in info[k].scout){info[k].scout[n]=info[k].scout[o];delete info[k].scout[o]}}
  for(const g of Object.values(GEN)){if(g.f===o)g.f=n;if(g.jail===o)g.jail=n;if(g.from===o)g.from=n;if(g.mole===o)g.mole=n}
  ITEMS.forEach(i=>{if(i.stock===o)i.stock=n});if(G.me===o)G.me=n}
function succeed(f,heir,notes){const old=GEN[f];const cities=citiesOf(f);

    const all=mbox.querySelector("#mall");if(all)all.onclick=()=>{if(on.size===list.filter(g=>!disable(g)).length)on.clear();else list.forEach(g=>!disable(g)&&on.add(g.n));draw()};

function recruitChance(g,x,myF){
  const myLord=GEN[myF];const gapMe=affGap(x.aff,myLord?myLord.aff:75);
  if(!x.f)return Math.round(Math.max(5,Math.min(92,50+eff(g,"cha")*.5-x.cha*.25-gapMe*.6)));
  if(x.loyal>=100)return 0;
  const gapThem=affGap(x.aff,GEN[x.f]?GEN[x.f].aff:75);
  return Math.round(Math.max(1,Math.min(85,(100-x.loyal)*1.6+eff(g,"cha")*.2+(gapThem-gapMe)*.5-10)));
}
function joinFaction(x,f,city){
  const old=GEN[x.n];
  if(old){const from=old.city;if(info[from]&&info[from].gov===x.n)info[from].gov="—";if(G.advisor&&G.advisor[old.f]===x.n)delete G.advisor[old.f];
    old.f=f;old.city=city;old.loyal=rint(60,75);old.rank=0;old.acted=true;old.away=0;return old}
  delete FREE[x.n];GEN[x.n]={n:x.n,city,war:x.war,lead:x.lead,int:x.int,pol:x.pol,cha:x.cha,aff:x.aff,f,loyal:rint(62,78),acted:true,away:0,renown:x.renown||0,rank:0,skills:x.skills||[startSkill(x)],...KEEP(x),forms:learnForms(x)};return GEN[x.n]
}

function scheme(k,type,near){

    if(type==="叛變"){const c=info[t];h+=`<p class="note">太守：${c.gov}${CAP[c.f]===t?"（本城由君主坐鎮，無法叛變）":""}</p>`}
    if(type==="驅虎吞狼"){const os=others(t);if(!os.includes(extraPick.v))extraPick.v=os[0];
      h+=`<p class="note" style="margin:0">挑撥 ${info[t].f} 去對付</p><div class="opts">${os.map(x=>`<button data-x="v" data-v="${x}" aria-pressed="${extraPick.v===x}">${x}<small> 友好${rel(info[t].f,x)}</small></button>`).join("")}</div>`}

  const list=cityGens(k,f).filter(g=>!g.acted&&!(type==="埋伏"&&isLord(g)));
  chooseGens({title:`${type}`,multi:false,note:KEI.find(x=>x.n===type).d,extra,list,cols:STAT,okLabel:"執行",
    check:p=>{if(!p.length)return{ok:false,msg:""};const ch=chance(p[0]);if(!ch)return{ok:false,msg:"此計無法施行"};const a=advice(ch,[type,p[0].n,extraPick.t,extraPick.u,extraPick.v].join("|"));return{ok:true,msg:a||""}},
    onOk:async([g])=>{const t=extraPick.t,c=info[t],ef=c.f;const ch=chance(g);g.acted=true;BANK[f].gold-=SCHEME_COST;G.used++;
      const ok=roll(ch,[type,g.n,extraPick.t,extraPick.u,extraPick.v].join("|"));closeModal();
      await playSchemeAnim(type,{g,city:t,ef,ok,victim:extraPick.u,other:extraPick.v});const L=[`<div><b>${g.n}</b> 對 ${t} 施行「${type}」…</div>`];
      if(!ok){
        if(type==="驅虎吞狼"&&Math.random()<.6){const a=addRel(ef,f,-rint(10,15)),b=addRel(extraPick.v,f,-rint(10,15));
          L.push(`<div class="ng">計謀被識破！${ef} 對你的友好度降為 ${a}，${extraPick.v} 降為 ${b}</div>`)}

      else if(type==="流言"){const b=c.loyal;c.loyal=Math.max(0,c.loyal-rint(5,10));L.push(`<div class="ok">謠言四起，${t} 民心 ${b} → ${c.loyal}</div>`)}
      else if(type==="離間"){const x=GEN[extraPick.u];const b=x.loyal;x.loyal=Math.max(0,x.loyal-rint(6,12));L.push(`<div class="ok"><b>${x.n}</b> 對 ${ef} 心生不滿，忠誠 ${b} → ${x.loyal}</div>`)}
      else if(type==="放火"){const fa=c.farm,tr=c.trade;c.farm=Math.round(c.farm*(.88+Math.random()*.06));c.trade=Math.round(c.trade*(.88+Math.random()*.06));const fd=Math.min(BANK[ef].food,rint(5,15)*100);BANK[ef].food-=fd;
        L.push(`<div class="ok">${t} 大火！農田 ${fa}→${c.farm}，商業 ${tr}→${c.trade}，${ef} 損失糧 ${fd}</div>`)}

        L.push(`<div class="ok">${t} 爆發暴動！城牆 ${w}→${c.wall}，兵力 ${tp}→${c.troops}，民心 ${b}→${c.loyal}</div>`)}

      else if(type==="偵察"){c.scout=c.scout||{};c.scout[f]=G.t+3;L.push(`<div class="ok">取得 ${t} 的情報：兵力 ${c.troops.toLocaleString()}・民心 ${c.loyal}・城牆 ${c.wall}<br>三個月內可在地圖上查看詳細資料</div>`)}
      else if(type==="叛變"){const x=GEN[c.gov];const nf=x.n;const palette=["#8c5a9e","#4f8a5b","#a06a2c","#5a6fa0","#9a4a5a","#6a8a2a","#2a7a8a"];
        F[nf]={c:palette[Object.keys(F).length%palette.length]};CAP[nf]=t;LORD_AFF[nf]=x.aff;BANK[nf]={gold:500,food:5000};
        const follow=Object.values(GEN).filter(y=>y.city===t&&y.f===ef);follow.forEach(y=>{y.f=nf;if(y!==x)y.loyal=rint(60,80);y.rank=0});x.loyal=100;
        c.f=nf;drawCity(t);buildLegend();
        L.push(`<div class="ok"><b>${nf}</b> 脫離 ${ef}，在 ${t} 自立！帶走武將 ${follow.length} 人</div>`)}
      else if(type==="驅虎吞狼"){const v=addRel(ef,extraPick.v,-rint(15,25));L.push(`<div class="ok">${ef} 與 ${extraPick.v} 互相猜忌，友好度降為 ${v}</div>`)}
      renderStatus();if(curCity)select(curCity,false);showResult(`${type}${ok?"成功":"失敗"}`,L)}});
}

/* ================= 外交 ================= */
const TREATY={};   // key "甲|乙" → {type:"同盟"/"停戰", until:G.t}
const tkey=(a,b)=>[a,b].sort().join("|");
const treaty=(a,b)=>{const x=TREATY[tkey(a,b)];return x&&x.until>G.t?x:null};
const tdate=t=>{const m=(G.m0||1)-1+t;return`${(G.y0||194)+Math.floor(m/12)}年${m%12+1}月`};
const citiesOf=f=>Object.keys(info).filter(k=>info[k].f===f);
const troopsOf=f=>citiesOf(f).reduce((a,k)=>a+info[k].troops,0);
/* 被你包圍：對方所有對外相連的城都是你的 → 不會跟你同盟，還會敵視你 */
function surroundedBy(f,me){const out=new Set();citiesOf(f).forEach(k=>adj[k].forEach(n=>{if(info[n].f!==f)out.add(info[n].f||"空白")}));return out.size===1&&out.has(me)}
const HOSTILE={};
/* 毀約：同盟或停戰期間硬打對方。名聲 −50，被打的勢力友好度 −30，其他所有勢力對你友好度 −10（軍事出征時呼叫） */
function breakTreaty(f,t){const x=treaty(f,t);if(!x)return null;delete TREATY[tkey(f,t)];
  BONUS[f]=(BONUS[f]||0)-50;addRel(f,t,-30);factionsAlive().forEach(o=>{if(o!==f&&o!==t)addRel(f,o,-10)});
  return`你撕毀與 ${t} 的${x.type}！名聲 −50，${t} 友好度 −30，其他勢力對你友好度 −10`}
const factionsAlive=()=>Object.keys(F).filter(f=>citiesOf(f).length);
const envoyBonus=g=>eff(g,"cha")*.3;
const GIFT_GOLD=[0,200,500,1000],GIFT_FOOD=[0,2000,5000,10000],ALLY_MONTHS=[6,12,24,36,48,60];
const GKEI=[
 {n:"贈送",d:"送金或糧，提高對方友好度"},
 {n:"同盟",d:"半年～五年，期間互不攻擊。可附禮物提高成功率"},
 {n:"停戰",d:"半年或一年內互不攻擊"},
 {n:"勸降",d:"要求對方整個勢力歸順。實力差距要夠大"},
 {n:"朝貢",d:"獻金給漢帝，提高名聲"},
 {n:"共同作戰",d:"請盟友半年內一起攻打某座城"},
];
function relTable(me){
  return`<div class="rels">${factionsAlive().filter(f=>f!==me).sort((a,b)=>rel(me,b)-rel(me,a)).map(f=>{const t=treaty(me,f);const v=rel(me,f);
    return`<b style="color:${F[f].c}">${f}</b><div class="bar"><span style="width:${v}%"></span></div><span>${v}</span><span>${t?`<span class="tg">${t.type}至${tdate(t.until)}</span>`:HOSTILE[tkey(me,f)]?`<span class="hs">敵視你</span>`:`${citiesOf(f).length}城`}</span>`}).join("")}</div>`}
function openGaiko(k){
  const f=info[k].f;modal.classList.remove("mid");
  mbox.innerHTML=`<h3>外交</h3><p class="note">派一位武將當使者，用 1 個指令，魅力越高越容易成功。失敗沒有任何改變，帶去的禮物也會帶回來。</p>
  ${relTable(f)}
  <div class="sub">${GKEI.map(j=>`<button data-j="${j.n}" ${j.off||(j.n==="朝貢"&&!G.emp)?"disabled":""}><b>${j.n}</b>${j.n==="朝貢"&&!G.emp?"漢朝已亡，無處朝貢":j.d}</button>`).join("")}</div>
  <div class="mfoot"><span class="sum"></span><button class="mbtn ghost" id="mcancel">返回</button></div>`;
  mbox.querySelector("#mcancel").onclick=closeModal;
  mbox.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>diplo(k,b.dataset.j));
  modal.hidden=false;
}
function diplo(k,type){
  const f=info[k].f;const allies=factionsAlive().filter(x=>x!==f&&treaty(f,x)&&treaty(f,x).type==="同盟");const targets=type==="共同作戰"?allies:factionsAlive().filter(x=>x!==f);
  if(type==="共同作戰"&&!allies.length){showResult("共同作戰",[`<div class="ng">目前沒有同盟的勢力。先跟其他勢力結盟才能請求共同作戰。</div>`]);return}
  const jointCities=a=>[...new Set(citiesOf(f).flatMap(c=>adj[c]))].filter(x=>info[x].f&&info[x].f!==f&&info[x].f!==a);
  extraPick={t:targets.includes(extraPick.t)?extraPick.t:targets[0],gold:+extraPick.gold||0,food:+extraPick.food||0,item:extraPick.item||"",m:+extraPick.m||12};
  if(type==="朝貢"&&![300,500,1000].includes(extraPick.gold))extraPick.gold=300;
  if(type==="停戰"&&extraPick.m>12)extraPick.m=6;
  if(type==="共同作戰"){const cs=jointCities(extraPick.t);if(!cs.includes(extraPick.c))extraPick.c=cs[0]}
  const stock=stockOf(f);
  const giftVal=()=>({gold:Math.min(extraPick.gold,BANK[f].gold),food:Math.min(extraPick.food,BANK[f].food),item:stock.find(i=>i.n===extraPick.item)});
  const chance=g=>{const t=extraPick.t,r=rel(f,t),gv=giftVal();
    if(type==="贈送"||type==="朝貢")return 100;
    if(type==="同盟"){if(surroundedBy(t,f))return 0;if(treaty(f,t)&&treaty(f,t).type==="同盟")return 0;
      const gift=gv.gold/40+gv.food/400+(gv.item?20:0);const longPen=(extraPick.m-6)/6*4*(r>=80?.3:1);
      return Math.round(Math.max(0,Math.min(95,(r-35)*1.3+envoyBonus(g)+gift-longPen)))}
    if(type==="停戰"){if(treaty(f,t))return 0;const power=troopsOf(f)/Math.max(1,troopsOf(t));
      return Math.round(Math.max(0,Math.min(90,(r-30)*1.1+envoyBonus(g)+(power-1)*15-(extraPick.m>6?10:0))))}
    if(type==="共同作戰"){const c=extraPick.c;if(!c)return 0;const o=info[c].f;if(o&&treaty(t,o)&&treaty(t,o).type==="同盟")return 0;
      if(!citiesOf(t).some(x=>cityDist(x,c)<=REINF_MAX))return 0;
      return Math.round(Math.max(0,Math.min(90,(r-30)*1.2+envoyBonus(g)+(o&&rel(t,o)<40?15:0)-(o&&rel(t,o)>65?20:0))))}
    if(type==="勸降"){const cr=citiesOf(f).length/citiesOf(t).length,tr=troopsOf(f)/Math.max(1,troopsOf(t));
      if(cr<3||tr<3)return 0;return Math.round(Math.max(0,Math.min(70,(cr-3)*5+(tr-3)*5+(r-50)*.5+envoyBonus(g)-15)))}
    return 0};
  const opt=(key,vals,lab)=>`<div class="opts">${vals.map(v=>`<button data-x="${key}" data-v="${v}" aria-pressed="${String(extraPick[key])===String(v)}">${lab(v)}</button>`).join("")}</div>`;
  const extra=()=>{const t=extraPick.t;let h=type==="朝貢"?"":`<p class="note" style="margin:0">對象</p>${opt("t",targets,x=>`${x}<small> 友好${rel(f,x)}${treaty(f,x)?"・"+treaty(f,x).type:""}</small>`)}`;
    if(type==="同盟"){h+=`<p class="note" style="margin:0">期間</p>${opt("m",ALLY_MONTHS,m=>m<12?"半年":m/12+"年")}
      <p class="note" style="margin:0">附贈黃金</p>${opt("gold",GIFT_GOLD,v=>v?v:"不送")}<p class="note" style="margin:0">附贈兵糧</p>${opt("food",GIFT_FOOD,v=>v?v:"不送")}
      ${stock.length?`<p class="note" style="margin:0">附贈寶物</p>${opt("item",["",...stock.map(i=>i.n)],v=>v||"不送")}`:""}
      ${surroundedBy(t,f)?`<p class="note" style="color:#a3362a">${t} 已被你包圍，不會跟你同盟，而且敵視你</p>`:""}`}
    if(type==="停戰")h+=`<p class="note" style="margin:0">期間</p>${opt("m",[6,12],m=>m<12?"半年":"一年")}`;
    if(type==="贈送")h+=`<p class="note" style="margin:0">黃金</p>${opt("gold",GIFT_GOLD,v=>v?v:"不送")}<p class="note" style="margin:0">兵糧</p>${opt("food",GIFT_FOOD,v=>v?v:"不送")}`;
    if(type==="勸降")h+=`<p class="note">你 ${citiesOf(f).length} 城・兵 ${troopsOf(f).toLocaleString()}　對方 ${citiesOf(t).length} 城・兵 ${seen(citiesOf(t)[0])?troopsOf(t).toLocaleString():"？"}<br>城數和兵力都要是對方的 3 倍以上才有機會</p>`;
    if(type==="朝貢")h+=`<p class="note" style="margin:0">獻金</p>${opt("gold",[300,500,1000],v=>v)}`;
    if(type==="共同作戰"){const cs=jointCities(t);if(!cs.includes(extraPick.c))extraPick.c=cs[0];
      h+=`<p class="note" style="margin:0">請盟友一起攻打（半年內有效）</p>${cs.length?opt("c",cs,x=>`${x}<small>（${info[x].f}）${citiesOf(t).some(y=>cityDist(y,x)<=REINF_MAX)?"":"・太遠"}</small>`):"<p class='note'>沒有相鄰的敵城</p>"}
      ${JOINT[t]&&JOINT[t].until>G.t?`<p class="note">目前約定：${JOINT[t].city}，至 ${tdate(JOINT[t].until)}</p>`:""}`}
    return h};
  chooseGens({title:`${type}`,multi:false,note:GKEI.find(x=>x.n===type).d,extra,list:cityGens(k,f).filter(g=>!g.acted),cols:STAT,okLabel:"派出使者",
    check:p=>{if(!p.length)return{ok:false,msg:""};const gv=giftVal();
      if((type==="贈送")&&!gv.gold&&!gv.food)return{ok:false,msg:"選要送的東西"};
      if(type==="朝貢"&&(!extraPick.gold||extraPick.gold>BANK[f].gold))return{ok:false,msg:"金不夠"};
      if((extraPick.gold>BANK[f].gold||extraPick.food>BANK[f].food)&&type!=="朝貢")return{ok:false,msg:"金糧不夠"};
      const ch=chance(p[0]);if(!ch)return{ok:false,msg:type==="同盟"&&surroundedBy(extraPick.t,f)?"對方被你包圍，拒絕同盟":"對方不會答應"};
      if(ch>=100)return{ok:true,msg:""};
      const a=advice(ch,[type,p[0].n,extraPick.t,extraPick.m,extraPick.gold,extraPick.food,extraPick.item,extraPick.c].join("|"));return{ok:true,msg:a||""}},
    onOk:async([g])=>{const t=extraPick.t,gv=giftVal();const ch=chance(g);g.acted=true;G.used++;const ok=roll(ch,[type,g.n,extraPick.t,extraPick.m,extraPick.gold,extraPick.food,extraPick.item,extraPick.c].join("|"));const L=[];const jc=extraPick.c;
      closeModal();await playDiploAnim(type,{g,t,city:jc,m:extraPick.m,gv:type==="朝貢"?{gold:extraPick.gold}:(type==="同盟"||type==="贈送")?gv:{},ok:ch>=100||ok});
      const pay=()=>{BANK[f].gold-=gv.gold;BANK[f].food-=gv.food;if(BANK[t]){BANK[t].gold+=gv.gold;BANK[t].food+=gv.food}if(gv.item){gv.item.stock=t}};
      if(type==="朝貢"){const v=extraPick.gold;BANK[f].gold-=v;const fm=Math.round(v/50);BONUS[f]=(BONUS[f]||0)+fm;L.push(`<div class="ok"><b>${g.n}</b> 入朝獻金 ${v}，天子嘉許，名聲 +${fm}</div>`)}
      else if(type==="贈送"){pay();const d=Math.round(gv.gold/50+gv.food/500)+2;const v=addRel(f,t,d);L.push(`<div class="ok"><b>${g.n}</b> 帶著${gv.gold?"金 "+gv.gold:""}${gv.food?" 糧 "+gv.food:""}拜訪 ${t}，友好度升為 ${v}</div>`)}
      else if(!ok){L.push(`<div class="ng">${t} 拒絕了${type}的提議，${type==="同盟"&&(gv.gold||gv.food||gv.item)?"禮物原封帶回。":"沒有任何改變。"}</div>`)}
      else if(type==="同盟"){pay();TREATY[tkey(f,t)]={type:"同盟",until:G.t+extraPick.m};const v=addRel(f,t,10);
        L.push(`<div class="ok">${t} 答應同盟！期限至 ${tdate(G.t+extraPick.m)}，友好度升為 ${v}</div>`)}
      else if(type==="共同作戰"){JOINT[t]={city:jc,until:G.t+6};L.push(`<div class="ok">${t} 答應共同作戰！至 ${tdate(G.t+6)} 前你出兵 ${jc} 時，${t} 會從附近的城派兵相助</div>`)}
      else if(type==="停戰"){TREATY[tkey(f,t)]={type:"停戰",until:G.t+extraPick.m};L.push(`<div class="ok">${t} 答應停戰，至 ${tdate(G.t+extraPick.m)} 互不攻擊</div>`)}
      else if(type==="勸降"){const cs=citiesOf(t);cs.forEach(c=>{info[c].f=f;drawCity(c)});
        Object.values(GEN).filter(x=>x.f===t).forEach(x=>{x.f=f;x.loyal=x.n===t?rint(60,70):rint(55,75);x.rank=0});
        BANK[f].gold+=BANK[t].gold;BANK[f].food+=BANK[t].food;stockOf(t).forEach(i=>i.stock=f);buildLegend();
        L.push(`<div class="ok">${t} 率眾歸順！得到 ${cs.join("、")}，以及全部武將</div>`)}
      renderStatus();if(curCity)select(curCity,false);showResult(type==="贈送"||type==="朝貢"?type:`${type}${ok?"成功":"失敗"}`,L)}});
}

const mergeTrain=(c,add,tr)=>{const tot=c.troops+add;c.train=tot?Math.round((c.train*c.troops+tr*add)/tot):c.train;c.troops=tot};
const GUN=[
 {n:"出征",d:"選武將帶兵攻打相鄰的城"},

function 徵兵(k){

  const est=g=>Math.round(extraPick.v*(.85+eff(g,"cha")/400));
  chooseGens({title:`徵兵`,multi:false,note:"在武將所在的城強制徵召，兵比較多但民心會下降。每 1000 兵花金 100，民心約 −2。新兵訓練度低，會拉低全城訓練。",
    extra:()=>`<div class="opts">${[1000,2000,5000,10000].map(v=>`<button data-x="v" data-v="${v}" aria-pressed="${extraPick.v===v}">${v} 兵</button>`).join("")}</div>`,

/* 出兵分配：每位武將自己決定帶多少兵（上限看官職與規則），可一鍵帶滿 */
function troopPicker(ps,src,done){const c=info[src];const cap=g=>maxTroops(g);const STEP=100;
  const v={};let left=c.troops;ps.forEach(g=>{const n=Math.min(cap(g),left);v[g.n]=n;left-=n});
  const draw=()=>{const tot=ps.reduce((a,g)=>a+v[g.n],0),food=Math.round(tot/2);const over=tot>c.troops;modal.classList.remove("mid");
    mbox.innerHTML=`<h3>出兵分配</h3><p class="note">${src} 城內有 ${c.troops.toLocaleString()} 兵。拉動或輸入每位武將要帶的兵，上限看官職（君主、智力 90 政治 80 以上可帶 20000）。</p>
      <div class="tpick">${ps.map(g=>`<div class="tp"><b>${g.n}</b><small>上限 ${cap(g).toLocaleString()}</small>
        <input type="range" min="0" max="${cap(g)}" step="${STEP}" value="${v[g.n]}" data-r="${g.n}"><input type="number" min="0" max="${cap(g)}" step="${STEP}" value="${v[g.n]}" data-n="${g.n}" class="cin"></div>`).join("")}</div>
      <div class="opts" style="margin:8px 0"><button id="tmax">一鍵上限</button><button id="tavg">平均分配</button><button id="tzero">全部清空</button></div>
      <div class="mfoot"><span class="sum" style="${over||food>BANK[G.me].food?"color:#a3362a":""}">共 ${tot.toLocaleString()} 兵${over?`（超過城內 ${(tot-c.troops).toLocaleString()}）`:""}・軍糧 ${food.toLocaleString()}${food>BANK[G.me].food?"（糧不夠）":""}</span>
      <button class="mbtn ghost" id="mcancel">取消</button><button class="mbtn" id="mok" ${over||!tot||food>BANK[G.me].food?"disabled":""}>出征</button></div>`;
    modal.hidden=false;
    const set=(n,val)=>{const g=ps.find(x=>x.n===n);v[n]=Math.max(0,Math.min(cap(g),Math.round((+val||0)/STEP)*STEP))};
    mbox.querySelectorAll("[data-r]").forEach(e=>e.oninput=()=>{set(e.dataset.r,e.value);const o=mbox.querySelector(`[data-n="${e.dataset.r}"]`);if(o)o.value=v[e.dataset.r];sumOnly()});
    mbox.querySelectorAll("[data-r]").forEach(e=>e.onchange=draw);
    mbox.querySelectorAll("[data-n]").forEach(e=>e.onchange=()=>{set(e.dataset.n,e.value);draw()});
    mbox.querySelector("#tmax").onclick=()=>{let l=c.troops;ps.forEach(g=>{const n=Math.min(cap(g),l);v[g.n]=n;l-=n});draw()};
    mbox.querySelector("#tavg").onclick=()=>{const each=Math.floor(c.troops/ps.length/STEP)*STEP;ps.forEach(g=>v[g.n]=Math.min(cap(g),each));draw()};
    mbox.querySelector("#tzero").onclick=()=>{ps.forEach(g=>v[g.n]=0);draw()};
    mbox.querySelector("#mcancel").onclick=closeModal;
    mbox.querySelector("#mok").onclick=()=>{const army=ps.map(g=>({g,t:v[g.n]})).filter(u=>u.t>0);done(army)}};
  const sumOnly=()=>{const tot=ps.reduce((a,g)=>a+v[g.n],0),food=Math.round(tot/2),over=tot>c.troops;const s=mbox.querySelector(".sum");const ok=mbox.querySelector("#mok");
    if(s){s.textContent=`共 ${tot.toLocaleString()} 兵${over?`（超過城內 ${(tot-c.troops).toLocaleString()}）`:""}・軍糧 ${food.toLocaleString()}${food>BANK[G.me].food?"（糧不夠）":""}`;s.style.color=over||food>BANK[G.me].food?"#a3362a":""}

/* 有守軍就進戰場；空城直接佔領 */
async function goBattle(k,t,army,pre,opts={}){closeModal();await playMarchAnim(k,t,army.map(u=>u.g.n));const d=info[t];const hasDef=d.troops>0||Object.values(GEN).some(g=>g.city===t&&g.f===d.f&&d.f&&!g.away);
  if(hasDef)startBattle(k,t,army.filter(u=>u.t>0),pre,opts);else battle(k,t,army,pre)}
function battle(k,t,army,L,quiet){
  const f=info[k].f,c=info[k],d=info[t],ef=d.f;
  const sent=army.reduce((a,u)=>a+u.t,0);c.troops-=sent;BANK[f].food-=Math.round(sent/2);const tr=c.train;
  army.forEach(u=>u.g.acted=true);if(!quiet)G.used++;
  L.push(`<div><b>${army.map(u=>u.g.n).join("、")}</b> 率 ${sent.toLocaleString()} 兵攻打 ${t}${ef?`（${ef}）`:"（空白城）"}</div>`);
  // 守軍：城內武將分兵，剩下的是無將守備
  let defGens=ef?Object.values(GEN).filter(g=>g.city===t&&g.f===ef&&!g.away):[];
  const moles=defGens.filter(g=>g.mole===f);let left=d.troops;
  let def=defGens.map(g=>{const n=Math.min(maxTroops(g),left);left-=n;return{g,t:n}});
  const garrison={g:{n:"守備兵",war:35,lead:35,int:30,pol:30,cha:30},t:left};
  moles.forEach(m=>{const u=def.find(x=>x.g===m);if(u){army.push(u);def=def.filter(x=>x!==u);L.push(`<div class="ok"><b>${m.n}</b> 陣前倒戈，帶 ${u.t.toLocaleString()} 兵投向你！</div>`);m.f=f;delete m.mole;m.loyal=rint(80,95)}});
  defGens=def.map(u=>u.g);
  const all=[...def,garrison].filter(u=>u.t>0);
  const wall=1+(d.wall/(d.capWall||1000))*.6;
  // 五回合互相消耗
  for(let r=0;r<5;r++){const A=power(army,tr),D=power(all,d.train,wall);if(!A||!D)break;
    const la=D/(A+D)*.22*(.8+Math.random()*.4),ld=A/(A+D)*.22*(.8+Math.random()*.4);
    army.forEach(u=>u.t=Math.round(u.t*(1-la)));all.forEach(u=>u.t=Math.round(u.t*(1-ld)))}
  const aLeft=army.reduce((a,u)=>a+u.t,0),dLeft=all.reduce((a,u)=>a+u.t,0);
  const win=dLeft<sent*.15||aLeft>dLeft*1.6||(!ef&&aLeft>dLeft);
  L.push(`<div>戰果：我軍剩 ${aLeft.toLocaleString()} 兵，敵軍剩 ${dLeft.toLocaleString()} 兵</div>`);
  if(win){
    // 敗軍武將撤往相鄰己城，沒地方去就成為在野
    Object.values(GEN).filter(g=>g.city===t&&g.f===ef&&!defGens.includes(g)).forEach(g=>defGens.push(g));
    jailBreak(t,f,null);
    defGens.forEach(g=>{const back=adj[t].find(x=>info[x].f===ef);if(back){g.city=back}else if(!isLord(g)&&capture(g,f,t)){handlePrisoners([g],f===G.me?"__ai":f,()=>{})}else{if(isLord(g))L.push(`<div class="ng">${g.n} 失去所有城池，勢力滅亡</div>`);
      delete GEN[g.n];FREE[g.n]={n:g.n,city:t,war:g.war,lead:g.lead,int:g.int,pol:g.pol,cha:g.cha,aff:g.aff,found:true,skills:g.skills,renown:g.renown,...KEEP(g)}}});
    d.f=f;d.troops=aLeft;d.train=tr;d.gov=army[0].g.n;d.loyal=Math.max(0,d.loyal-5);army.forEach(u=>u.g.city=t);
    if(ef&&CAP[ef]===t){const rest=citiesOf(ef);if(rest.length)CAP[ef]=rest[0];else delete CAP[ef]}
    if(ef){addRel(f,ef,-10)}
    drawCity(t);if(ef&&CAP[ef])drawCity(CAP[ef]);buildLegend();
    L.push(`<div class="ok">攻下 ${t}！${defGens.length?"敗將撤退或流亡在野。":""}</div>`);
  }else{
    mergeTrain(c,aLeft,tr);d.troops=dLeft;if(ef)addRel(f,ef,-10);
    L.push(`<div class="ng">攻城失敗，殘兵撤回 ${k}。</div>`)}
  if(quiet)return{win,ef};
  renderStatus();select(k,false);showResult(win?"勝利":"敗退",L);
}

const TECH_COST=800,TECH_MONTHS=3;
const TECHS={};      // 勢力 → Set(已研發)
const RESEARCH={};   // 勢力 → {n, left}
const hasTech=(f,n)=>TECHS[f]&&TECHS[f].has(n);
function formStat(f,form,k){let v=FORM[form][k];for(const n in TECH)if(TECH[n].form===form&&hasTech(f,n))v+=TECH[n].fx[k]||0;return v}

/* 武將會的陣型（最多 6 種），依能力與出身決定 */
const NAVY=new Set(["孫策","周瑜","程普","黃蓋","韓當","蔣欽","周泰","甘寧","蔡瑁","張允","黃祖","文聘","陸遜","魯肅","太史慈","張昭"]);
["孫權","呂蒙","徐盛","潘璋","朱然","丁奉","凌統","朱桓","全琮","賀齊","陳武","董襲","凌操","宋謙","呂範","孫韶","留贊","呂岱","朱據","孫桓","孫皎","孫瑜","陸凱","周魴","孫堅","祖茂","孫賁"].forEach(n=>NAVY.add(n));
function learnForms(g){if(g.cforms)return g.cforms.slice();
  const L=[];const add=x=>{if(!L.includes(x)&&L.length<6)L.push(x)};
  if(NAVY.has(g.n))add("水陣");
  if(g.war>=85)add("偃月");
  if(g.war>=75)add("魚鱗");
  if(g.int>=85)add("方圓");
  if(g.lead>=85)add("鶴翼");
  if(g.int>=75)add("雁行");
  if(g.war>=80&&g.lead>=75)add("鋒矢");
  if(g.int>=80&&g.pol>=75)add("箕形");
  if(g.lead>=75)add("錐行");
  if(g.int>=70&&g.lead>=70)add("衡軛");
  if(g.lead>=70&&g.war>=70)add("鉤形");
  add("錐行");add("長蛇");add("魚鱗");
  return L;
}

/* ================= 戰鬥 ================= */
/* B.me：玩家這一方（atk 攻方／def 守方）；另一方由電腦操作 */
const MAX_DAYS=30;
const B={};
const bOdd=(c,r)=>{const o=[[c-1,r],[c+1,r]];for(const dr of[-1,1])r&1?o.push([c,r+dr],[c+1,r+dr]):o.push([c-1,r+dr],[c,r+dr]);return o};
const bCube=(c,r)=>{const x=c-(r-(r&1))/2;return[x,r,-x-r]};
const bDist=(a,b)=>{const A=bCube(a[0],a[1]),C=bCube(b[0],b[1]);return Math.max(Math.abs(A[0]-C[0]),Math.abs(A[1]-C[1]),Math.abs(A[2]-C[2]))};
const isWater=k=>k==="w";
function stepCost(form,k){
  if(k==="M"||k==="S")return Infinity;
  const t=FORM[form].t;
  if(t==="水"){if(k==="w"||k==="P"||k==="b")return 1;return k==="f"||k==="h"||k==="d"||k==="z"?3:2}
  if(k==="w")return 3;
  if(k==="f"||k==="h")return t==="山"?1:2;
  if(k==="d"||k==="z")return 2;
  return 1;
}
function bCell(c,r){return B.M.grid[r]&&B.M.grid[r][c]}
function unitAt(c,r){return B.units.find(u=>u.alive&&u.c===c&&u.r===r)}
function reach(u){

const G3={anims:[]};

/* 2D 模式自己跑動畫迴圈 */
function kick2d(){if(G3.raf)return;const f=now=>{if(tickAnims(now))drawUnits();G3.raf=G3.anims.length?requestAnimationFrame(f):null};G3.raf=requestAnimationFrame(f)}
function tween(dur,step,redraw){return new Promise(res=>{G3.anims.push({t0:performance.now(),dur,step,redraw,done:res});kick2d()})}
/* 部隊在兩格之間的位置（移動、衝鋒時用） */
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function segPos(u,P){if(!u.seg)return P(u.c,u.r);const A=P(...u.seg.a),C=P(...u.seg.b);return[A[0]+(C[0]-A[0])*u.seg.t,A[1]+(C[1]-A[1])*u.seg.t]}

  return tween(900,k=>{t.setAttribute("y",y-k*24);t.setAttribute("opacity",1-k*k)},false).then(()=>t.remove())}

const STEP_MS=350;
async function playMove(u,path){if(bEl.hidden||!path||path.length<2)return;
  for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];await tween(STEP_MS,t=>{u.seg={a,b,t:ease(t)}},true)}u.seg=null}

function aiTurn(notes,queue){
  for(const f of factionsAlive()){if(f===G.me)continue;
    let cmds=title(f)[2];const cs=citiesOf(f);
    const idle=k=>Object.values(GEN).filter(g=>g.city===k&&g.f===f&&!g.away&&!g.injured&&!g.acted);
    // 出征：一個月最多一次，找最有把握的目標
    if(Math.random()<.45){let best=null;
      cs.forEach(k=>{const c=info[k];if(c.troops<6000||!idle(k).length)return;
        adj[k].forEach(t=>{const d=info[t];if(d.f===f)return;if(d.f&&treaty(f,d.f))return;
          const defG=Object.values(GEN).filter(g=>g.city===t&&g.f===d.f&&!g.away).length;
          const defP=d.f?d.troops*(1+d.wall/(d.capWall||1000)*.6)*(1+defG*.05)+2000:500;
          let score=c.troops*.8/defP;if(d.f===G.me)score*=HOSTILE[tkey(f,G.me)]?1.2:.8;
          if(!best||score>best.score)best={k,t,score}})});
      if(best&&best.score>=1.4&&cmds>0&&BANK[f].food>2000){
        const c=info[best.k];const gs=idle(best.k).sort((a,b)=>(b.war+b.lead)-(a.war+a.lead)).slice(0,10);
        let left=Math.round(c.troops*.8);const army=gs.map(g=>{const n=Math.min(maxTroops(g),left);left-=n;return{g,t:n}}).filter(u=>u.t>0);
        if(army.length){cmds--;
          if(info[best.t].f===G.me)queue.push({k:best.k,t:best.t,army,f});
          else{const r=battle(best.k,best.t,army,[],true);if(r.win)notes.push(`${f} 攻下 ${best.t}${r.ef?`（原屬 ${r.ef}）`:""}`)}}}}
    // 內政：有錢就把閒著的武將派去
    cs.forEach(k=>{if(cmds<=0)return;const c=info[k];const gs=idle(k);if(!gs.length)return;
      if(c.troops<8000&&BANK[f].gold>=200){cmds--;const n=1000+Math.round(Math.random()*1000);BANK[f].gold-=100;mergeTrain(c,n,30);gs[0].acted=true;return}
      const use=gs.slice(0,Math.floor(BANK[f].gold/50));if(!use.length)return;cmds--;
      const gain=naiseiGain(c,use);NAISEI.forEach(it=>c[it.k]+=gain[it.k]);BANK[f].gold-=use.length*NAISEI_COST;use.forEach(g=>g.acted=true)});
    // 有剩指令就訓練
    cs.forEach(k=>{if(cmds<=0)return;const c=info[k];if(c.train>=90)return;const gs=idle(k);if(!gs.length)return;cmds--;c.train=Math.min(100,c.train+Math.round(gs.reduce((a,g)=>a+eff(g,"lead")/8,0)));gs.forEach(g=>g.acted=true)});
  }
}

/* 被俘武將：g.jail＝關押他的勢力，g.from＝原本的勢力，g.f＝null，人留在被俘的城 */
function capture(g,captor,city){if(!GEN[g.n]||isLord(g))return false;
  if(info[g.city]&&info[g.city].gov===g.n)info[g.city].gov="—";if(G.advisor)for(const f in G.advisor)if(G.advisor[f]===g.n)delete G.advisor[f];
  itemsOf(g.n).forEach(i=>{i.owner=null;i.stock=captor});g.from=g.f;g.f=null;g.jail=captor;g.city=city;g.loyal=Math.max(0,g.loyal-15);g.rank=0;g.acted=true;g.away=0;return true}
const prisonersOf=(f,city)=>Object.values(GEN).filter(g=>g.jail===f&&(!city||g.city===city));
function persuadeChance(g,f){const lord=GEN[f];if(!lord)return 0;const x={...g,f:g.from};if(!GEN[g.from])return Math.round(Math.max(10,Math.min(90,60+eff(lord,"cha")*.3-affGap(g.aff,lord.aff)*.6)));
  return Math.round(Math.max(3,Math.min(85,(100-g.loyal)*1.2+eff(lord,"cha")*.25+(affGap(g.aff,GEN[g.from].aff)-affGap(g.aff,lord.aff))*.5)))}
function freePrisoner(g){const home=g.from&&citiesOf(g.from)[0];delete g.jail;
  if(home){g.f=g.from;g.city=home;delete g.from;return`${g.n} 回到 ${g.f} 的 ${home}`}
  delete GEN[g.n];FREE[g.n]={n:g.n,city:g.city,war:g.war,lead:g.lead,int:g.int,pol:g.pol,cha:g.cha,aff:g.aff,found:true,skills:g.skills,renown:g.renown,...KEEP(g)};return`${g.n} 成為在野武將`}
function recruitPrisoner(g,f){delete g.jail;delete g.from;g.f=f;g.loyal=rint(55,70);g.acted=true}
