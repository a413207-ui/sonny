  mbox.querySelector("#mcancel").onclick=closeModal;
  mbox.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{const g=GEN[b.dataset.r];G.used++;renderStatus();
    const win=roll(persuadeChance(g,f),"俘|"+g.n);closeModal();await playPrisonAnim(G.me,g,win);
    if(win){recruitPrisoner(g,f);if(curCity)select(curCity,false);showResult("說服成功",[`<div class="ok">${g.n} 願意歸順！</div>`])}
    else{g.loyal=Math.max(0,g.loyal-rint(3,8));if(curCity)select(curCity,false);showResult("說服失敗",[`<div class="ng">${g.n} 不為所動（忠誠降為 ${g.loyal}）。</div>`])}});
  mbox.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const g=GEN[b.dataset.f];const from=g.from;const m=freePrisoner(g);if(from&&GEN[from])addRel(f,from,5);if(curCity)select(curCity,false);showResult("釋放",[`<div class="ok">${m}</div>`])});
  modal.hidden=false}
/* 城池易主時，牢裡的人：新主人的舊部回歸，其他人放出去 */
function jailBreak(city,newOwner,L){prisonersOf(null,city);Object.values(GEN).filter(g=>g.jail&&g.city===city).forEach(g=>{
  if(g.from===newOwner){recruitPrisoner(g,newOwner);g.loyal=Math.min(100,g.loyal+20);L&&L.push(`<div class="ok">救出了被俘的 ${g.n}！</div>`)}else{L&&L.push(`<div>${freePrisoner(g)}</div>`)}})}

/* ================= 電腦的外交與計謀 ================= */
function aiPlots(notes,queue){
  for(const f of factionsAlive()){if(f===G.me)continue;const mine=citiesOf(f);if(!mine.length)continue;
    const near=[...new Set(mine.flatMap(k=>adj[k]).filter(t=>info[t].f&&info[t].f!==f&&!treaty(f,info[t].f)))];
    // 計謀（花金 100）
    if(near.length&&BANK[f].gold>=300&&Math.random()<.3){BANK[f].gold-=100;const t=near[rint(0,near.length-1)],ef=info[t].f,c=info[t];
      const agents=Object.values(GEN).filter(g=>g.f===f&&!g.away);const agent=agents.sort((a,b)=>b.int-a.int)[0];if(!agent)continue;
      const victims=Object.values(GEN).filter(g=>g.city===t&&g.f===ef&&!isLord(g)&&!g.away);
      const pick=Math.random();const toMe=ef===G.me;
      if(pick<.35&&victims.length){ // 挖角：忠誠低的最危險
        const v=victims.sort((a,b)=>a.loyal-b.loyal)[0];const ch=recruitChance(agents.sort((a,b)=>b.cha-a.cha)[0],v,f);
        if(Math.random()*100<ch){const back=mine.find(k=>adj[k].includes(t))||mine[0];joinFaction(v,f,back);if(toMe)notes.push(`<span style="color:#e0604f">${t} 的 ${v.n} 被 ${f} 挖走了！</span>`)}}
      else if(pick<.6&&victims.length){const v=victims[rint(0,victims.length-1)];if(v.loyal<100&&Math.random()*100<baseP(agent,t)){const b=v.loyal;v.loyal=Math.max(0,v.loyal-rint(6,12));if(toMe)notes.push(`有人散布謠言，${v.n} 的忠誠 ${b} → ${v.loyal}`)}}
      else if(pick<.8){if(Math.random()*100<baseP(agent,t)){const b=c.loyal;c.loyal=Math.max(0,c.loyal-rint(5,10));if(toMe)notes.push(`${f} 在 ${t} 散布流言，民心 ${b} → ${c.loyal}`)}}
      else{const gv=GEN[c.gov];if(gv&&!isLord(gv)&&CAP[ef]!==t&&gv.loyal<65){const ch=Math.max(0,(70-gv.loyal)*1.3+affGap(gv.aff,(GEN[ef]||{aff:75}).aff)*.4-15);
        if(Math.random()*100<ch){const nf=gv.n;const pal=["#8c5a9e","#4f8a5b","#a06a2c","#5a6fa0","#9a4a5a","#6a8a2a","#2a7a8a"];F[nf]={c:pal[Object.keys(F).length%pal.length]};CAP[nf]=t;LORD_AFF[nf]=gv.aff;BANK[nf]={gold:500,food:5000};
          Object.values(GEN).filter(y=>y.city===t&&y.f===ef).forEach(y=>{y.f=nf;y.rank=0;if(y!==gv)y.loyal=rint(60,80)});gv.loyal=100;c.f=nf;drawCity(t);buildLegend();
          notes.push(`<span style="color:#e0604f">${f} 煽動成功：${nf} 脫離 ${ef}，在 ${t} 自立！</span>`)}}}}
    // 外交
    if(Math.random()<.2){const others=factionsAlive().filter(o=>o!==f&&!treaty(f,o));if(!others.length)continue;
      const o=others.sort((a,b)=>rel(f,b)-rel(f,a))[0];const r=rel(f,o);
      if(o===G.me){if((r>=60&&Math.random()<.5)||troopsOf(G.me)>troopsOf(f)*2&&adj[mine[0]]&&near.some(t=>info[t].f===G.me)){
          const type=r>=60?"同盟":"停戰";const m=type==="同盟"?[12,24,36][rint(0,2)]:6;const gift=type==="同盟"?rint(1,4)*100:0;
          if(!HOSTILE[tkey(f,G.me)]&&!surroundedBy(f,G.me))queue.push({kind:"propose",f,type,m,gift})}}
      else if(r>=65){TREATY[tkey(f,o)]={type:"同盟",until:G.t+[12,24][rint(0,1)]};notes.push(`${f} 與 ${o} 結為同盟`)}
      else if(BANK[f].gold>800&&Math.random()<.5){BANK[f].gold-=200;if(BANK[o])BANK[o].gold+=200;addRel(f,o,6)}}
  }
}
async function proposeDialog(x,next){if(!factionsAlive().includes(x.f)){next();return}await playIncomingDiplo(x);modal.classList.add("mid");
  mbox.innerHTML=`<h3>${x.f} 的使者</h3><p class="note">${x.f} 提議與你${x.type}${x.type==="同盟"?` ${x.m/12} 年`:"半年"}${x.gift?`，並獻上金 ${x.gift}`:""}。<br>目前友好度 ${rel(x.f,G.me)}。</p>
    <div class="mfoot"><span class="sum"></span><button class="mbtn ghost" id="mno">拒絕</button><button class="mbtn" id="myes">答應</button></div>`;modal.hidden=false;
  mbox.querySelector("#myes").onclick=()=>{TREATY[tkey(x.f,G.me)]={type:x.type,until:G.t+x.m};if(x.gift&&BANK[x.f].gold>=x.gift){BANK[x.f].gold-=x.gift;BANK[G.me].gold+=x.gift}addRel(x.f,G.me,8);renderStatus();
    modal.classList.remove("mid");closeModal();toast(`與 ${x.f} ${x.type}，至 ${tdate(G.t+x.m)}`);next()};
  mbox.querySelector("#mno").onclick=()=>{addRel(x.f,G.me,-5);modal.classList.remove("mid");closeModal();next()}}

/* ================= 結局 ================= */
let ENDED=false;
function checkEnding(){if(ENDED||!G.me)return false;
  if(citiesOf(G.me).length===Object.keys(info).length){ENDED=true;const gs=Object.values(GEN).filter(g=>g.f===G.me);const best=gs.slice().sort((a,b)=>(b.renown||0)-(a.renown||0)).slice(0,5);
    modal.classList.add("mid");
    mbox.innerHTML=`<div class="ending"><div class="et">天下一統</div><p>${G.year} 年 ${G.month} 月，<b>${G.me}</b> 平定四海，結束了漢末以來的亂世。</p>
      <p class="note">歷時 ${Math.floor(G.t/12)} 年 ${G.t%12} 個月・城池 ${Object.keys(info).length} 座・麾下武將 ${gs.length} 人・名聲 ${fame(G.me)}</p>
      <div class="sec">功臣</div><div class="items">${best.map(g=>`<div><b>${g.n}</b><span>${RANKS[g.rank||0].n}</span><small>威名 ${g.renown||0}・${(g.skills||[]).join("、")}</small></div>`).join("")}</div>
      <div class="mfoot"><span class="sum"></span><button class="mbtn ghost" id="mcont">繼續遊玩</button><button class="mbtn" id="mnew">重新開始</button></div></div>`;
    modal.hidden=false;mbox.querySelector("#mcont").onclick=()=>{modal.classList.remove("mid");closeModal()};mbox.querySelector("#mnew").onclick=()=>location.reload();return true}
  if(!citiesOf(G.me).length){ENDED=true;modal.classList.add("mid");
    mbox.innerHTML=`<div class="ending"><div class="et" style="color:#e0604f">霸業未竟</div><p>${G.year} 年 ${G.month} 月，<b>${G.me}</b> 失去了所有城池……</p>
      <div class="mfoot"><span class="sum"></span><button class="mbtn ghost" id="mload2">讀取存檔</button><button class="mbtn" id="mnew">重新開始</button></div></div>`;
    modal.hidden=false;mbox.querySelector("#mnew").onclick=()=>location.reload();mbox.querySelector("#mload2").onclick=()=>{ENDED=false;openSave("load")};return true}
  return false}

/* ---------- 研發（軍事） ---------- */
function 研發(k){
  const f=info[k].f;TECHS[f]=TECHS[f]||new Set();const R0=RESEARCH[f];
  if(R0){showResult("研發",[`<div>正在研發「${R0.n}」，還要 ${R0.left} 個月。</div>`]);return}
  const avail=Object.keys(TECH).filter(n=>!TECHS[f].has(n));
  if(!avail.length){showResult("研發",[`<div class="ok">四項科技都已研發完成。</div>`]);return}
  extraPick={t:avail.includes(extraPick.t)?extraPick.t:avail[0]};
  chooseGens({title:`研發`,multi:false,note:`派一位武將主持研發，花金 ${TECH_COST}，${TECH_MONTHS} 個月完成（智力 90 以上縮短 1 個月）。同時只能研發一項。`,
    extra:()=>`<div class="opts">${avail.map(n=>`<button data-x="t" data-v="${n}" aria-pressed="${extraPick.t===n}">${n}<small>　${TECH[n].d}</small></button>`).join("")}</div>
      <p class="note">已完成：${[...TECHS[f]].join("、")||"無"}</p>`,
    list:cityGens(k,f).filter(g=>!g.acted),cols:STAT,okLabel:"開始研發",
    check:p=>({ok:p.length&&BANK[f].gold>=TECH_COST,msg:BANK[f].gold<TECH_COST?"金不夠":""}),
    onOk:async([g])=>{closeModal();await playResearchAnim(g,extraPick.t);g.acted=true;BANK[f].gold-=TECH_COST;RESEARCH[f]={n:extraPick.t,left:TECH_MONTHS-(eff(g,"int")>=90?1:0)};
      spend();showResult("研發",[`<div class="ok"><b>${g.n}</b> 開始研發「${extraPick.t}」，${RESEARCH[f].left} 個月後完成。</div>`])}});
}

for(const n in GEN){GEN[n].forms=learnForms(GEN[n]);GEN[n].skills=[startSkill(GEN[n])]}

/* ---------- 結束回合 ---------- */
function endTurn(){SND.sfx("gong");
  const notes=[];
  for(const k in info){const c=info[k];
    if(c.f&&c.loyal>=100&&c.flood>=100&&c.wall>=c.capWall&&c.trade>=c.capTrade&&c.farm>=c.capFarm){BONUS[c.f]=(BONUS[c.f]||0)+2;if(c.f===G.me)notes.push(`${k} 內政全滿，名聲 +2`)}}
  for(const f in RESEARCH){const x=RESEARCH[f];if(--x.left<=0){(TECHS[f]=TECHS[f]||new Set()).add(x.n);if(f===G.me)notes.push(`科技「${x.n}」研發完成：${TECH[x.n].d}`);delete RESEARCH[f]}}
  const queue=[];
  for(const n in GEN){const g=GEN[n];g.acted=false;
    if(g.injured){g.injured--;if(!g.injured&&g.f===G.me)notes.push(`${g.n} 傷勢痊癒`)}
    if(g.away){g.away--;
      if(g.away%3===0){const ev=[["拜訪名士，見識大增",8,14],["在山中遇到猛虎，徒手擊退",10,16],["為村民剿滅山賊",9,15],["遊歷各地，名聲傳開",6,12]][rint(0,3)];
        const v=rint(ev[1],ev[2])*20;if(g.f===G.me)notes.push(`${g.n} 修行中${ev[0]}，威名 +${v}`);addRenown(g,v,notes)}
      if(!g.away){if(info[g.home]&&info[g.home].f===g.f)g.city=g.home;if(g.f===G.me)notes.push(`${g.n} 修行歸來（威名 ${g.renown}）`)}}}
  aiTurn(notes,queue);aiPlots(notes,queue);monthEvents(notes);
  G.used=0;G.month++;G.t++;
  for(const key in TREATY){const x=TREATY[key];if(x.until===G.t&&key.split("|").includes(G.me)){notes.push(`與 ${key.split("|").find(y=>y!==G.me)} 的${x.type}到期`)}}
  factionsAlive().forEach(x=>{if(x!==G.me&&surroundedBy(x,G.me)&&!HOSTILE[tkey(x,G.me)]){HOSTILE[tkey(x,G.me)]=1;addRel(x,G.me,-15);notes.push(`${x} 被你包圍，開始敵視你`)}});if(G.month>12){G.month=1;G.year++}
  if(G.month===1)matureCustoms(notes);lifeTick(notes,queue);if(G.month===1)queue.unshift({kind:"tourney"});
  const before=G.cmds;renderStatus();
  if(G.cmds>before)notes.push(`升官為 ${title(G.me)[0]}，每月指令增為 ${G.cmds}`);
  // 每月兵糧消耗：每 50 兵吃 1 糧；糧不夠時逃兵一成
  for(const f of factionsAlive()){const need=Math.round(troopsOf(f)/50);BANK[f].food-=need;
    if(BANK[f].food<0){BANK[f].food=0;citiesOf(f).forEach(k=>info[k].troops=Math.round(info[k].troops*.9));if(f===G.me)notes.push(`<span style="color:#e0604f">兵糧不足，各城士兵逃走一成</span>`)}}
  // 每季收入（1、4、7、10 月）：所有城的商業給金、農田給糧，民心越高收越多
  if([1,4,7,10].includes(G.month)){
    for(const f of factionsAlive()){let gold=0,food=0;
      citiesOf(f).forEach(k=>{const c=info[k];const m=.5+c.loyal/200;gold+=c.trade*m;food+=c.farm*10*m});
      const dm=f===G.me?[1.3,1,.85][OPT.diff]:[.85,1,1.2][OPT.diff];gold=Math.round(gold*dm);food=Math.round(food*dm/100)*100;BANK[f].gold+=gold;BANK[f].food+=food;
      if(f===G.me)notes.push(`<b>季收入</b>　金 +${gold.toLocaleString()}・糧 +${food.toLocaleString()}`)}}
  renderStatus();
  toast(`<b>${G.year}年 ${G.month}月</b>${notes.length?"<br>"+notes.join("<br>"):""}`,queue.length?3500:2600);
  if(OPT.auto)writeSlot(0);
  if(checkEnding())return;
  if(queue.length)setTimeout(()=>runInvasions(queue),400);
  if(curCity)select(curCity,false);
}
/* ================= 存檔（存在這台手機的瀏覽器裡） ================= */
const SAVE_KEY="sgz5_save_",SLOTS=[0,1,2,3];   // 0 是每月自動存檔
const slotName=i=>i?`存檔 ${i}`:"自動存檔";
const CITY_KEYS=["f","gov","pop","troops","train","loyal","flood","wall","trade","farm","capWall","capTrade","capFarm","scout"];
function snapshot(){
  const cities={};for(const k in info){cities[k]={};CITY_KEYS.forEach(x=>cities[k][x]=info[k][x])}
  const techs={};for(const f in TECHS)techs[f]=[...TECHS[f]];
  return{v:1,G:{year:G.year,month:G.month,t:G.t,me:G.me,used:G.used,advisor:G.advisor||{},pending:G.pending||[],scn:G.scn,y0:G.y0,m0:G.m0,emp:G.emp,empName:G.empName},cities,GEN,FREE,
    items:ITEMS.map(i=>({n:i.n,owner:i.owner,stock:i.stock,city:i.city})),BANK,BONUS,REL,TREATY,HOSTILE,JOINT,techs,RESEARCH,F,CAP,LORD_AFF,
    meta:{date:`${G.year}年${G.month}月`,lord:G.me,cities:citiesOf(G.me).length,saved:new Date().toLocaleString("zh-TW")}}}
const fill=(dst,src)=>{for(const k of Object.keys(dst))delete dst[k];Object.assign(dst,JSON.parse(JSON.stringify(src)))};
function restore(d){ENDED=false;
  Object.assign(G,d.G);for(const k in d.cities)Object.assign(info[k],d.cities[k]);
  fill(GEN,d.GEN);fill(FREE,d.FREE);fill(BANK,d.BANK);fill(BONUS,d.BONUS);fill(REL,d.REL);fill(TREATY,d.TREATY);fill(JOINT,d.JOINT||{});fill(HOSTILE,d.HOSTILE);
  fill(RESEARCH,d.RESEARCH);fill(F,d.F);fill(CAP,d.CAP);fill(LORD_AFF,d.LORD_AFF);
  for(const k of Object.keys(TECHS))delete TECHS[k];for(const f in d.techs)TECHS[f]=new Set(d.techs[f]);
  d.items.forEach(x=>{const it=ITEMS.find(i=>i.n===x.n);if(it){it.owner=x.owner;if(x.stock)it.stock=x.stock;else delete it.stock;if(x.city!==undefined)it.city=x.city}});
  for(const k in info)drawCity(k);buildLegend();curCity=null;renderStatus();select(CAP[G.me]||citiesOf(G.me)[0],true)}
const readSlot=i=>{try{const t=localStorage.getItem(SAVE_KEY+i);return t?JSON.parse(t):null}catch(e){return null}};
function writeSlot(i){try{localStorage.setItem(SAVE_KEY+i,JSON.stringify(snapshot()));return true}catch(e){return false}}
function slotList(mode){return SLOTS.filter(i=>mode==="load"||i>0).map(i=>{const d=readSlot(i);
  return`<button data-slot="${i}" ${mode==="load"&&!d?"disabled":""}><b>${slotName(i)}</b>${d?`${d.meta.lord}・${d.meta.date}・${d.meta.cities} 城<br><small>${d.meta.saved}</small>`:"（空）"}</button>`}).join("")}
function openSave(mode){
  modal.classList.remove("mid");
  mbox.innerHTML=`<h3>${mode==="save"?"存檔":"讀檔"}</h3><p class="note">存檔保存在這台手機的瀏覽器裡。換手機、換瀏覽器或清除瀏覽資料後會不見。每個月結束時會自動存到「自動存檔」。</p>
    <div class="lords slots">${slotList(mode)}</div><p class="note" id="smsg"></p>
    <div class="mfoot"><span class="sum"></span><button class="mbtn ghost" id="mcancel">返回</button></div>`;
  modal.hidden=false;mbox.querySelector("#mcancel").onclick=()=>{closeModal();if(!G.me)titleScreen()};
  mbox.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{const i=+b.dataset.slot;
    if(mode==="save"){if(writeSlot(i)){toast(`已存到「${slotName(i)}」`);closeModal()}else mbox.querySelector("#smsg").textContent="存檔失敗：這個瀏覽器不允許儲存（可能是無痕模式）。"}
    else{const d=readSlot(i);if(!d)return;try{restore(d);closeModal();toast(`已讀取「${slotName(i)}」：${d.meta.lord}・${d.meta.date}`)}catch(e){mbox.querySelector("#smsg").textContent="讀檔失敗，存檔可能已損壞。"}}})}
renderStatus();{let v="menu";try{v=sessionStorage.getItem("sgz5_goto")||"menu";sessionStorage.removeItem("sgz5_goto");
  const bt=JSON.parse(sessionStorage.getItem("sgz5_boot")||"null");sessionStorage.removeItem("sgz5_boot");if(bt){if(bt.scn&&bt.scn!==194)applyScenario(bt.scn);v=bt.go||v}}catch(e){console.warn(e)}titleScreen(v)}
})();
</script>
